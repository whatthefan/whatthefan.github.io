# Netlify lee esto solo. Las paginas siguen siendo HTML suelto: no hay
# nada que compilar, por eso no hay comando de construccion.
[build]
  publish = "."
  functions = "netlify/functions"

# El taller es para ti, no para los clientes. Ademas de estar fuera del
# robots.txt, aqui se le dice a los buscadores que no lo indexen aunque
# alguien enlace la pagina desde fuera.
[[headers]]
  for = "/taller/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
