  [6, [...Array(12)].map((_, i) => `M${70 + (i % 4) * 58} ${220 + Math.floor(i / 4) * 58} h46 v46 h-46 z`).join(' ')],

const NOTAS = ['entra', 'rebota', 'veinte', 'reloj', 'cae', 'palabra', 'baldosas', 'nombre', 'firma'];
const bocetos = BOC.map(([i, d]) => { const g = mk('g', { transform: `translate(${(i % 3) * 360} ${Math.floor(i / 3) * 640})` }, $('bocetos')); return mk('path', { d }, g); });
$('panes').innerHTML = [...Array(9)].map((_, i) => `<div class="pan" style="left:${(i % 3) * 360}px;top:${Math.floor(i / 3) * 640}px"><div class="num">${String(i + 1).padStart(2, '0')}</div><div class="nota">${NOTAS[i]}</div></div>`).join('');

const FUENTES = ['900 italic 250px F', '700 250px I', '400 italic 270px S', '400 210px M', '900 250px F', '400 280px A'];

const LETS = [...$('palabra').children];

const NOM = ['P', 'L', 'E', 'A', '', 'E'];
$('nombre').innerHTML = NOM.map((c, i) => `<div class="slot" style="left:${i < 5 ? i * 150 : 840}px">${c}</div>`).join('');
const SLOTS = [...$('nombre').children];

window.render = t => {
  const push = 1 + .025 * Math.sin(t * .35);
  /* ---- A · el prompt ---- */
  const S = 'Hazme un motion de 20 segundos.', n = Math.floor(cl((t - .25) * 17, 0, S.length));
  $('cajaTxt').innerHTML = (t < 2.25 ? S.slice(0, n) : '') + (t < 2.25 && (n < S.length || Math.floor(t * 2.6) % 2) ? '<span class="car"></span>' : '');

  $('respRow').style.opacity = cl((t - 17.6) * 4); pintaChispa(RM, 0, 0, 34, oE(p(t, 17.6, .5)), t, t * 20, t > 18.8 ? 0 : 1, 7);

  F.style.opacity = t < 2.45 ? 0 : 1; F.style.background = t < 3.6 ? 'transparent' : 'var(--noche)'; $('halo').style.opacity = t < 3.6 ? 0 : 1;
  const marco = $('marco'); marco.style.display = kf > .98 ? 'block' : 'none'; Object.assign(marco.style, { left: '240px', top: '530px', width: '600px', height: '1067px' });
  // chispa: nace, piensa, sus rayos se vuelven la rejilla
  const kCh = oE(p(t, 2.5, .6)), kSal = iE(p(t, 3.5, .35));
  if (t < 4.0) { const R = lerp(0, 200, kCh) * (1 - kSal * .8); pintaChispa(RC, 540, 900, R, kCh, t, t * 30 + kSal * 72, 1 - kSal, 30); $('chispa').style.opacity = 1 - kSal; } else $('chispa').style.opacity = 0;
  $('pensando').innerHTML = t > 2.75 && t < 3.6 ? [...'Pensando…'].map((c, i) => `<span style="opacity:${.35 + .65 * (.5 + .5 * Math.sin(t * 9 - i * .6))}">${c}</span>`).join('') : '';

  const fueraSB = 1 - p(t, 5.92, .3); $('rejilla').style.opacity = t < 3.6 ? 0 : fueraSB;
  bocetos.forEach((b, j) => trazo(b, io(p(t, 4.0 + j * .07, .55)))); $('bocetos').style.opacity = fueraSB;
  $('panes').style.opacity = cl((t - 4.0) * 3) * fueraSB;

    else { const k = (u - .55) / .4; y = 1116 - 190 * Math.sin(Math.min(k, 1) * Math.PI) * (1 - .15 * k); sx = 1 + .05 * Math.sin(k * 9) * (1 - k); sy = 1 - .05 * Math.sin(k * 9) * (1 - k); }
