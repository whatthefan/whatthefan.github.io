<script>
const $ = id => document.getElementById(id);
const { p, ease, muelle } = E;
const cl = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x)), lerp = (a, b, k) => a + (b - a) * k;
const oE = x => x >= 1 ? 1 : 1 - Math.pow(2, -10 * cl(x)), iE = x => x <= 0 ? 0 : Math.pow(2, 10 * cl(x) - 10);
const ioE = x => (x = cl(x)) <= 0 ? 0 : x >= 1 ? 1 : x < .5 ? Math.pow(2, 20 * x - 10) / 2 : (2 - Math.pow(2, -20 * x + 10)) / 2;
const io = x => (x = cl(x)) < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2, oC = x => 1 - Math.pow(1 - cl(x), 3), oB = x => { x = cl(x); const c = 1.8; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };

const TOTAL = 15; window.TOTAL = TOTAL;

/* ============ SONIDO (uno por suceso, ninguno más de 2 veces) ============ */
const FX = /*FX*/[{"t":0.25,"s":"packs2/teclas.mp3","db":-10,"dur":1.85},{"t":2.2,"s":"packs3/click.mp3","db":-6},{"t":2.55,"s":"packs3/pop-limpio.mp3","db":-7},{"t":3.62,"s":"packs3/swoosh-aire.mp3","db":-6},{"t":4.15,"s":"packs3/rafaga-fotos.mp3","db":-9},{"t":5.15,"s":"packs2/whoosh-b.mp3","db":-5},{"t":6.35,"s":"packs4/toque-bot.mp3","db":-4},{"t":6.92,"s":"packs2/pop-imagen.mp3","db":-7},{"t":7.2,"s":"packs2/contador.mp3","db":-10,"dur":0.85},{"t":8.05,"s":"packs/ding.mp3","db":-7},{"t":8.3,"s":"packs3/swoosh-suave.mp3","db":-7},{"t":8.8,"s":"packs3/rafaga-fotos2.mp3","db":-9},{"t":9.55,"s":"packs2/swish-c.mp3","db":-6},{"t":10.45,"s":"packs3/swoosh-corto.mp3","db":-7},{"t":10.9,"s":"packs/woah-drop.mp3","db":-3},{"t":13.2,"s":"packs2/whoosh-mov.mp3","db":-6},{"t":13.7,"s":"packs4/respuesta.mp3","db":-7},{"t":14.25,"s":"packs2/teclas.mp3","db":-11,"dur":0.6}]/*FX*/;

/* ============ la chispa (10 rayos irregulares, redondeados) ============ */
const RAYOS = [[0, 1], [36, .78], [71, .95], [108, .7], [144, .9], [180, .82], [215, .98], [252, .72], [288, .92], [324, .8]];

const RC = chispa($('chispa'), 1, 34), RM = chispa($('chispaMini'), 1, 7);
function pintaChispa(lines, cx, cy, R, k, t, rot = 0, piensa = 0, w) {
  lines.forEach((ln, i) => { const [a0, l] = RAYOS[i], kk = oB(cl(k * 1.6 - i * .06)), osc = 1 + piensa * .22 * Math.sin(t * 7 - i * 1.1), a = (a0 + rot) * Math.PI / 180, r0 = R * .16, r1 = R * l * kk * osc;
    ln.setAttribute('x1', cx + Math.cos(a) * r0 * cl(kk)); ln.setAttribute('y1', cy + Math.sin(a) * r0 * cl(kk)); ln.setAttribute('x2', cx + Math.cos(a) * Math.max(r0, r1)); ln.setAttribute('y2', cy + Math.sin(a) * Math.max(r0, r1));
    ln.style.opacity = kk > .02 ? 1 : 0; if (w) ln.setAttribute('stroke-width', w); }); }

/* ============ storyboard: rejilla 3×3 y bocetos ============ */
const REJ = [[360, 0, 360, 1920], [720, 0, 720, 1920], [0, 640, 1080, 640], [0, 1280, 1080, 1280]].map(([x1, y1, x2, y2]) => mk('line', { x1: 540, y1: 960, x2: 540, y2: 960 }, $('rejilla')));
const REJF = [[360, 0, 360, 1920], [720, 0, 720, 1920], [0, 640, 1080, 640], [0, 1280, 1080, 1280]];
const BOC = [ // [panel, d]
  [0, 'M60 420 C 120 200, 240 200, 300 420 M270 380 L300 420 L320 370'], [1, 'M70 470 Q 180 150 290 470 M 230 470 a 50 50 0 1 0 100 0 a 50 50 0 1 0 -100 0'], [2, 'M100 250 L150 210 L150 440 M210 220 L290 220 L210 330 C 300 310, 310 440, 210 440'],
  [3, [...Array(15)].map((_, i) => { const a = i / 15 * 6.283 - 1.57; return `M${180 + Math.cos(a) * 110 + 14} ${330 + Math.sin(a) * 110} a14 14 0 1 0 -28 0 a14 14 0 1 0 28 0`; }).join(' ')],
  [4, 'M180 90 L180 190 M180 220 L180 300 M 180 330 L180 380 M130 500 a50 50 0 1 0 100 0 a50 50 0 1 0 -100 0 M90 560 L270 560'], [5, 'M60 360 C 90 300, 110 300, 120 360 C 130 300, 150 300, 160 360 M 175 340 a 20 22 0 1 0 1 0 M 215 300 L 215 360 M 200 320 L 235 320 M 250 330 L 250 360 M 250 305 L 250 307 M 270 340 a 20 22 0 1 0 1 0 M 310 360 L 310 330 C 320 318, 335 320, 336 340 L 336 360'],
  [6, [...Array(12)].map((_, i) => `M${70 + (i % 4) * 58} ${220 + Math.floor(i / 4) * 58} h46 v46 h-46 z`).join(' ')], [7, 'M40 330 C 90 250, 130 250, 180 330 S 270 410, 320 330'],
  [8, [0, 36, 71, 108, 144, 180, 215, 252, 288, 324].map(a => { const r = a * Math.PI / 180; return `M${180 + Math.cos(r) * 18} ${320 + Math.sin(r) * 18} L${180 + Math.cos(r) * 90} ${320 + Math.sin(r) * 90}`; }).join(' ')]];
const NOTAS = ['entra', 'rebota', 'quince', 'reloj', 'cae', 'palabra', 'baldosas', 'ola', 'firma'];
const bocetos = BOC.map(([i, d]) => { const x = (i % 3) * 360, y = Math.floor(i / 3) * 640; const g = mk('g', { transform: `translate(${x} ${y})` }, $('bocetos')); const pth = mk('path', { d }, g); pth.userData = { i }; return pth; });
$('panes').innerHTML = [...Array(9)].map((_, i) => `<div class="pan" style="left:${(i % 3) * 360}px;top:${Math.floor(i / 3) * 640}px"><div class="num">${String(i + 1).padStart(2, '0')}</div><div class="nota">${NOTAS[i]}</div></div>`).join('');
const trazo = (el, k) => { if (!el._L) el._L = el.getTotalLength(); el.style.strokeDasharray = el._L; el.style.strokeDashoffset = el._L * (1 - cl(k)); };

/* ============ 15 puntos (reloj) ============ */
$('puntos').innerHTML = [...Array(15)].map(() => '<div class="dot"></div>').join('');
const DOTS = [...$('puntos').children];
/* ============ baldosas ============ */
const COLS = 9, FILAS = 16; $('baldosas').innerHTML = [...Array(COLS * FILAS)].map((_, i) => `<div class="tile" style="left:${(i % COLS) * 120}px;top:${Math.floor(i / COLS) * 120}px"><i style="background:#141413"></i><i style="background:#D97757;transform:rotateY(180deg)"></i></div>`).join('');
const TILES = [...$('baldosas').children];
/* ============ «motion» con letras que cambian de fuente ============ */
const FUENTES = ['900 italic 250px F', '700 250px I', '400 italic 270px S', '400 210px M', '900 250px F', '700 250px I'];
$('palabra').innerHTML = [...'motion'].map(c => `<span class="let">${c}</span>`).join('');
const LETS = [...$('palabra').children];
const TIT = ['Hecho', 'con', 'Claude.'];
$('titular').innerHTML = TIT.map((w, i) => `<span class="let" style="margin:0 .12em;${i === 2 ? 'font-style:italic;color:#D97757' : ''}">${w}</span>`).join('');
const TW = [...$('titular').children];

window.render = t => {
  /* ---- cámara global: empuje lento ---- */
  const push = 1 + .025 * Math.sin(t * .4);
  /* ---- A · el prompt ---- */
  const S = 'Hazme un motion de 15 segundos.', n = Math.floor(cl((t - .25) * 17, 0, S.length));
  $('cajaTxt').innerHTML = (t < 2.25 ? S.slice(0, n) : '') + (t < 2.25 && (n < S.length || Math.floor(t * 2.6) % 2) ? '<span class="car"></span>' : '');
  const bajaCaja = ioE(p(t, 2.3, .6)), vuelveCaja = ioE(p(t, 13.3, .7));
  const cajaY = t < 13.3 ? lerp(875, 2050, bajaCaja) : lerp(2050, 1700, vuelveCaja);
  $('caja').style.top = cajaY + 'px'; $('caja').style.transform = `scale(${t < 2.3 ? 1 + .02 * (1 - oE(p(t, 0, .6))) : 1})`;
  $('enviar').style.transform = `scale(${t > 2.12 && t < 2.3 ? .88 : 1})`; $('enviar').style.opacity = t < 2.25 || t > 13.3 ? 1 : 1;
  // burbuja del usuario: sube al enviar, se va con el storyboard y vuelve al final
  const kb = oE(p(t, 2.25, .6)), fueraB = ioE(p(t, 3.55, .4)), dentroB = oE(p(t, 13.35, .6));
  const bub = $('burbuja'); bub.style.opacity = t < 2.25 ? 0 : t < 13.3 ? 1 - fueraB : dentroB;
  bub.style.transform = t < 13.3 ? `translateY(${(1 - kb) * 700 - fueraB * 60}px) scale(${.9 + .1 * kb})` : `translateY(${(1 - dentroB) * -40}px)`;
  // respuesta final
  $('respRow').style.opacity = cl((t - 13.5) * 4); pintaChispa(RM, 0, 0, 34, oE(p(t, 13.5, .5)), t, t * 20, t > 14.6 ? 0 : 1, 7);
  const R1 = 'Aquí lo tienes.', R2 = '¿Hacemos otro?'; $('respTxt').textContent = R1.slice(0, Math.floor(cl((t - 13.75) * 30, 0, R1.length)));
  $('otro').innerHTML = R2.slice(0, Math.floor(cl((t - 14.25) * 26, 0, R2.length))) + (t > 14.25 && Math.floor(t * 2.6) % 2 ? '<span class="car"></span>' : '');

  /* ---- película ---- */
  const F = $('film');
  // entra/sale y final: se encoge dentro de la respuesta
  const kf = ioE(p(t, 13.2, .95)), fx = lerp(0, 240, kf), fy = lerp(0, 530, kf), fs = lerp(1, 600 / 1080, kf);
  F.style.transform = `translate(${fx}px,${fy}px) scale(${fs})`; F.style.borderRadius = kf * 60 + 'px'; F.style.boxShadow = kf > 0 ? `0 ${30 * kf}px ${80 * kf}px rgba(90,70,40,${.18 * kf})` : 'none';
  F.style.opacity = t < 2.45 ? 0 : 1; F.style.background = t < 3.6 ? 'transparent' : 'var(--crema)';
  const marco = $('marco'); marco.style.display = kf > .98 ? 'block' : 'none'; Object.assign(marco.style, { left: '240px', top: '530px', width: '600px', height: '1067px' });
  // chispa central: nace (2,5), piensa, sus rayos se vuelven la rejilla (3,6)
  const kCh = oE(p(t, 2.5, .6)), kSal = iE(p(t, 3.5, .35)), kFin = t > 10.85 ? oE(p(t, 10.88, .9)) : 0;
  if (t < 4.0) { const R = lerp(0, 190, kCh) * (1 - kSal * .8); pintaChispa(RC, 540, 900, R, kCh, t, t * 30 + kSal * 80, 1 - kSal, 30); $('chispa').style.opacity = 1 - kSal; }
  else if (t > 10.85) { const R = 260 * kFin * (1 + .02 * Math.sin(t * 3)); pintaChispa(RC, 540, 900, R, kFin, t, 12 + (t - 10.9) * 14, .15, 44); $('chispa').style.opacity = 1; }
  else $('chispa').style.opacity = 0;
  $('pensando').innerHTML = t > 2.75 && t < 3.6 ? [...'Pensando…'].map((c, i) => `<span style="opacity:${.35 + .65 * (.5 + .5 * Math.sin(t * 9 - i * .6))}">${c}</span>`).join('') : '';
  $('pensando').style.opacity = cl((t - 2.75) * 5) * (1 - p(t, 3.45, .15));
  // rejilla del storyboard
  REJ.forEach((l, i) => { const [x1, y1, x2, y2] = REJF[i], k = ioE(p(t, 3.6 + i * .06, .55)); l.setAttribute('x1', lerp(540, x1, k)); l.setAttribute('y1', lerp(960, y1, k)); l.setAttribute('x2', lerp(540, x2, k)); l.setAttribute('y2', lerp(960, y2, k)); });
  const fueraSB = 1 - p(t, 5.92, .3); $('rejilla').style.opacity = t < 3.6 ? 0 : fueraSB;
  bocetos.forEach((b, j) => trazo(b, io(p(t, 4.0 + j * .07, .55)))); $('bocetos').style.opacity = fueraSB;
  $('panes').style.opacity = cl((t - 4.0) * 3) * fueraSB;
  // zoom a la viñeta central (×3 exacto: 360×640 → 1080×1920)
  const kz = ioE(p(t, 5.1, .85)), zs = lerp(1, 3, kz), zx = lerp(0, -360 * 3, kz), zy = lerp(0, -640 * 3, kz);
  const capa = [$('svgF'), $('panes')]; capa.forEach(e => { e.style.transformOrigin = '0 0'; e.style.transform = t < 6.25 ? `translate(${zx}px,${zy}px) scale(${zs})` : 'none'; });
  $('svgF').style.filter = t > 5.1 && t < 5.95 ? `blur(${Math.sin(kz * Math.PI) * 6}px)` : 'none';
  // E1 · la bola cae, aplasta, rebota
  const bola = $('bola'), som = $('sombra');
  if (t >= 5.9 && t < 6.95) { const u = t - 5.9; let y, sx = 1, sy = 1;
    if (u < .45) { y = lerp(-120, 1116, Math.pow(u / .45, 2)); sy = 1 + .25 * (u / .45); sx = 1 - .12 * (u / .45); }
    else if (u < .55) { const k = (u - .45) / .1; y = 1116 + 20 * Math.sin(k * Math.PI); sx = 1 + .38 * Math.sin(k * Math.PI); sy = 1 - .34 * Math.sin(k * Math.PI); }
    else { const k = (u - .55) / .4; y = 1116 - 190 * Math.sin(Math.min(k, 1) * Math.PI) * (1 - .15 * k); sx = 1 + .05 * Math.sin(k * 9) * (1 - k); sy = 1 - .05 * Math.sin(k * 9) * (1 - k); }
    bola.setAttribute('cy', y); bola.setAttribute('r', 72); bola.setAttribute('transform', `translate(540 ${y + 72}) scale(${sx} ${sy}) translate(-540 ${-y - 72})`); bola.style.opacity = 1;
    som.setAttribute('rx', 90 * cl(1 - (1116 - y) / 900)); som.style.opacity = 1; }
  else { bola.style.opacity = 0; som.style.opacity = 0; }
  // E2 · 15 puntos en reloj
  const R = 300, cx = 540, cy = 960;
  DOTS.forEach((d, i) => { const a = i / 15 * Math.PI * 2 - Math.PI / 2 + (t - 7) * .35, k = oB(p(t, 6.92 + i * .012, .5)), conv = ioE(p(t, 8.15 + i * .01, .45));
    const x0 = 540, y0 = 1116 - 72, x1 = cx + Math.cos(a) * R, y1 = cy + Math.sin(a) * R, x2 = 540 - 380 + i * (760 / 14), y2 = 960;
    const x = t < 8.15 ? lerp(x0, x1, k) : lerp(x1, x2, conv), y = t < 8.15 ? lerp(y0, y1, k) : lerp(y1, y2, conv);
    d.style.left = x + 'px'; d.style.top = y + 'px'; d.style.display = t >= 6.92 && t < 8.7 ? 'block' : 'none';
    const on = t > 7.2 + i * (.8 / 15); d.style.background = on ? '#D97757' : 'transparent'; d.style.borderColor = on ? '#D97757' : '#141413';
