<!doctype html>
<html><head><meta charset="utf-8"><script src="escena.js"></script><style>

:root{--noche:#06080E;--oro:#E9BC46;--oro2:#F6D77A;--tinta:#0A0E16}

.sb{position:absolute;left:0;right:0;text-align:center;font:500 44px M;color:rgba(255,255,255,.62)}
</style></head><body>
<div id="todo" style="position:absolute;inset:0">
  <div id="noche" class="a" style="inset:0;background:var(--noche)"><div id="glow"></div></div>
  <!-- A · la mesa -->
  <div id="rotulo" class="a" style="left:0;right:0;top:470px;text-align:center;font:500 44px M;color:rgba(255,255,255,.8)"></div>
  <div id="placa"><div id="placaIn">
      <img src="m/sello-plea5e.svg" class="a" style="left:130px;top:120px;width:260px">

      <div class="a" style="left:0;right:0;top:595px;text-align:center;font:600 22px M;letter-spacing:.2em;color:var(--oro)">ACERCA EL MÓVIL</div>
    </div><div id="gota" class="a" style="background:var(--oro)"></div></div>

      <div class="a" style="left:0;right:0;top:66px;text-align:center"><span style="font:600 14px M;letter-spacing:.14em;color:#8a8577;border:1.5px solid #d9d4c7;border-radius:20px;padding:6px 12px">DEMOSTRACIÓN</span></div>
      <img src="m/sello-plea5e.svg" class="a" style="left:146px;top:150px;width:80px">
      <div class="a" style="left:0;right:0;top:282px;text-align:center;font:700 32px M">¿Qué tal la cena?</div>
      <div class="a" style="left:0;right:0;top:334px;text-align:center;font:500 17px M;color:#8a8577">Toca las estrellas</div>

      <div class="a" style="left:60px;top:568px;width:190px;height:12px;border-radius:6px;background:#dcd7cb"></div>
      <div class="a" style="left:60px;top:596px;width:130px;height:12px;border-radius:6px;background:#dcd7cb"></div>
      <div class="a" style="left:36px;right:36px;top:690px;height:64px;border-radius:32px;background:#0A0E16;color:#fff;font:700 20px/64px M;text-align:center">Publicar</div>
    </div><div id="brillo" class="a" style="inset:0;background:#fff;opacity:0"></div></div></div>
  <!-- D · la estrella que lo llena todo -->
  <div id="oro" class="a" style="inset:0;background:var(--oro);display:none"></div>
  <svg id="gran" class="a" width="1080" height="1920" style="left:0;top:0;overflow:visible"><g id="granG"><path id="granP" fill="#E9BC46" stroke="#E9BC46" stroke-width="40" stroke-linejoin="round"/></g></svg>
  <!-- E · UN TOQUE. -->
  <div id="un" class="pal" style="top:560px">UN</div>
  <div id="toque" class="pal" style="top:880px">TOQUE.</div>
  <div id="listo" class="a" style="left:0;right:0;top:1250px;text-align:center;font:italic 96px S;color:var(--tinta)">y ya está.</div>
  <!-- F · acerca / toca / opina -->
  <div id="noche2" class="a" style="inset:0;background:var(--noche)"><div style="position:absolute;inset:0;background:radial-gradient(circle at 50% 40%,rgba(233,188,70,.14),transparent 50%)"></div></div>
  <svg id="bala" class="a" width="1080" height="1920" style="left:0;top:0;overflow:visible"><g id="balaG"><path id="balaP" fill="#E9BC46" stroke="#E9BC46" stroke-width="30" stroke-linejoin="round"/></g></svg>
  <div id="lista"><div class="w">ACERCA</div><div class="w">TOCA</div><div class="w">OPINA</div></div>
  <div id="subs"><div class="sb" style="top:1150px">el móvil</div><div class="sb" style="top:1150px">la placa</div><div class="sb" style="top:1150px">sin descargar nada</div></div>
  <!-- G · marca -->
  <svg id="aro" class="a" width="1080" height="1920" style="left:0;top:0;overflow:visible" fill="none" stroke="#E9BC46"></svg>
  <img id="marca" src="m/marca-plea5e.svg" class="a" style="left:-85px;top:720px;width:1250px">
  <div id="l1" class="a" style="left:0;right:0;top:1060px;text-align:center;font:500 44px M;color:rgba(255,255,255,.82)">Placas NFC para tu negocio</div>
  <div id="l2" class="a" style="left:0;right:0;top:1130px;text-align:center;font:italic 80px S;color:var(--oro)">pago único.</div>
  <img id="estre" src="m/saluda.svg" class="a" style="left:500px;top:1180px;width:600px;transform-origin:50% 100%">
  <div id="pill" class="a" style="left:90px;top:1690px;height:110px;padding:0 44px;border-radius:55px;border:2px solid rgba(233,188,70,.5);background:rgba(233,188,70,.08);font:600 50px/106px M;white-space:nowrap"></div>
</div>
<div id="vin"></div><div id="grano"></div>
<script>
const $ = id => document.getElementById(id);
const { p, muelle } = E;
const cl = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x)), lerp = (a, b, k) => a + (b - a) * k;
const oE = x => x >= 1 ? 1 : 1 - Math.pow(2, -10 * cl(x)), iE = x => x <= 0 ? 0 : Math.pow(2, 10 * cl(x) - 10);
const ioE = x => (x = cl(x)) <= 0 ? 0 : x >= 1 ? 1 : x < .5 ? Math.pow(2, 20 * x - 10) / 2 : (2 - Math.pow(2, -20 * x + 10)) / 2;
const oB = x => { x = cl(x); const c = 1.8; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const NS = 'http://www.w3.org/2000/svg', mk = (tag, at, par) => { const e = document.createElementNS(NS, tag); for (const k in at) e.setAttribute(k, at[k]); par && par.appendChild(e); return e; };
const TOTAL = 15; window.TOTAL = TOTAL;

/* ============ SONIDO (uno por suceso, ninguno más de 2 veces) ============ */
const FX = /*FX*/[{"t":0.08,"s":"packs2/teclas.mp3","db":-10,"dur":1.15},{"t":1.45,"s":"packs3/pop-limpio.mp3","db":-6},{"t":2.05,"s":"packs3/swoosh-aire.mp3","db":-7},{"t":2.75,"s":"packs/iphone-charging.mp3","db":-5},{"t":3.35,"s":"packs2/whoosh-b.mp3","db":-6},{"t":4.0,"s":"packs3/tap.mp3","db":-5},{"t":4.12,"s":"packs2/contador.mp3","db":-10,"dur":0.62},{"t":4.8,"s":"packs/ding.mp3","db":-6},{"t":5.3,"s":"packs2/whoosh-mov.mp3","db":-5},{"t":6.05,"s":"packs2/pop-imagen.mp3","db":-6},{"t":6.4,"s":"packs4/toque-bot.mp3","db":-3},{"t":7.35,"s":"packs2/swoosh-a.mp3","db":-7},{"t":7.7,"s":"packs2/swish-c.mp3","db":-6},{"t":8.5,"s":"packs3/swoosh-corto.mp3","db":-6},{"t":9.3,"s":"packs3/swoosh-suave.mp3","db":-6},{"t":11.2,"s":"packs/woah-drop.mp3","db":-3},{"t":12.0,"s":"packs3/pop-limpio.mp3","db":-8},{"t":12.75,"s":"packs4/bot-saluda.mp3","db":-6},{"t":13.5,"s":"packs/mac-typing.mp3","db":-9,"dur":0.75}]/*FX*/;

/* estrella del sello (centrada en 0,0; ~100 de radio) */
const ESTRELLA = 'M512.0 41.0L633.8 323.8L962.6 352.3L709.1 555.6L776.8 856.0L512.0 698.8L247.2 856.0L314.9 555.6L61.4 352.3L390.2 323.8Z';
const est = (sc) => ESTRELLA.replace(/(\d+\.\d)\s(\d+\.\d)/g, (_, x, y) => `${((+x - 512) * sc).toFixed(2)} ${((+y - 500) * sc).toFixed(2)}`);
$('granP').setAttribute('d', est(100 / 470)); $('balaP').setAttribute('d', est(100 / 470));
// estrellas de la web
$('estrellas').innerHTML = [...Array(5)].map((_, i) => `<svg class="est" style="left:${26 + i * 66}px" viewBox="-60 -60 120 120"><path d="${est(48 / 470)}" fill="#E9BC46" stroke="#E9BC46" stroke-width="7" stroke-linejoin="round" class="rel"/><path d="${est(48 / 470)}" fill="none" stroke="#cfc9bb" stroke-width="5" stroke-linejoin="round"/></svg>`).join('');
const ESTS = [...$('estrellas').children];
const ONDAS = [...Array(4)].map(() => mk('circle', { cx: 540, cy: 1000, r: 0 }, $('ondas')));
const AROS = [...Array(3)].map(() => mk('circle', { cx: 540, cy: 845, r: 0 }, $('aro')));
const WS = [...$('lista').children], SB = [...$('subs').children];

window.render = t => {
  const drift = 1 + .018 * Math.sin(t * .45);
  /* ---- A · rótulo tecleado + gota que cae y se vuelve placa ---- */
  const R = 'Mesa 7. Fin de la cena.', n = Math.floor(cl((t - .08) * 21, 0, R.length));
  $('rotulo').innerHTML = R.slice(0, n) + (t < 1.9 && (n < R.length || Math.floor(t * 2.6) % 2) ? '<span class="car"></span>' : '');
  $('rotulo').style.opacity = 1 - p(t, 3.3, .3); $('rotulo').style.transform = `translateY(${-oE(p(t, 1.5, .6)) * 90}px)`;
  const PX = 540, PY = 1060, placa = $('placa'), gota = $('gota'), pin = $('placaIn');
  // gota: cae 0,9→1,45, se aplasta y se estira hasta ser la placa (1,45→2,0)
  const kg = ioE(p(t, 1.5, .55));
  let gy, sx = 1, sy = 1;
  if (t < 1.45) { const k = p(t, .9, .55); gy = lerp(PY - 380, PY + 290, k * k); sy = 1 + .35 * k; sx = 1 - .15 * k; }
  else { gy = lerp(PY + 290, PY, kg); const s = Math.sin(p(t, 1.45, .12) * Math.PI) * (1 - kg); sx = 1 + .5 * s; sy = 1 - .4 * s; }
  const gw = lerp(60, 520, oB(p(t, 1.5, .6))) * sx, gh = lerp(60, 700, oB(p(t, 1.5, .6))) * sy;
  Object.assign(gota.style, { left: (260 - gw / 2) + 'px', top: (gy - PY + 350 - gh / 2) + 'px', width: gw + 'px', height: gh + 'px', borderRadius: lerp(30, 48, kg) + 'px', opacity: t < .3 ? 0 : 1 - p(t, 1.95, .25) }); if (t < .9) { const k = oB(p(t, .3, .4)), pul = 1 + .08 * Math.sin((t - .3) * 14) * Math.exp(-(t - .3) * 3); gota.style.transform = `scale(${k * pul})`; } else gota.style.transform = 'none';
  pin.style.opacity = p(t, 1.9, .25); pin.style.transform = `scale(${.96 + .04 * oE(p(t, 1.9, .5))})`;
  const zoomM = ioE(p(t, 3.35, .65));
  placa.style.transform = `translate(${PX - 260}px,${PY - 350 + (t > 2.72 && t < 2.95 ? 10 * Math.sin(p(t, 2.72, .23) * Math.PI) : 0)}px) scale(${1 - .15 * zoomM})`;
  placa.style.filter = `blur(${zoomM * 10}px)`; placa.style.opacity = t < 4.1 ? 1 : 0;
  // ondas NFC
  ONDAS.forEach((c, i) => { const k = p(t, 2.75 + i * .12, .9); c.setAttribute('r', 40 + oE(k) * 520); c.setAttribute('stroke-width', 10 * (1 - k)); c.style.opacity = t > 2.75 + i * .12 && k < 1 ? (1 - k) : 0; });
  /* ---- B · el móvil entra, toca, y la cámara se mete en su pantalla ---- */
  const ke = oE(p(t, 2.05, .7)), mv = $('movil');
  let mx = lerp(1500, 690, ke), my = lerp(620, 880, ke), mr = lerp(-28, -10, ke), ms = 1;
  if (t > 2.6 && t < 2.95) { const k = Math.sin(p(t, 2.6, .35) * Math.PI); mx -= 18 * k; my += 16 * k; ms = 1 - .03 * k; }
  mx = lerp(mx, 540, zoomM); my = lerp(my, 960, zoomM); mr = lerp(mr, 0, zoomM); ms = lerp(ms, 2.4, zoomM);
  mv.style.transform = `translate(${mx - 200}px,${my - 410}px) rotate(${mr}deg) scale(${ms})`; mv.style.display = t < 2.0 || t > 6.1 ? 'none' : 'block';
  $('web').style.opacity = cl((t - 2.8) * 5); $('brillo').style.opacity = t > 2.75 ? .9 * Math.exp(-(t - 2.78) * 7) * (t > 2.78 ? 1 : 0) : 0;
  $('pant').style.borderRadius = lerp(50, 20, zoomM) + 'px';
  /* ---- C · cinco estrellas ---- */
  const dd = $('dedo'), kd = p(t, 3.95, .45); Object.assign(dd.style, { left: (26 + 4 * 66 + 28 - 45) + 'px', top: (448 - 45) + 'px', opacity: t > 3.95 ? 1 - kd : 0, transform: `scale(${.5 + kd * .9})` });
  ESTS.forEach((s, i) => { const t0 = 4.12 + i * .13, k = p(t, t0, .3), r = s.querySelector('.rel'); r.style.opacity = t > t0 ? 1 : 0;
    s.style.transform = `scale(${t > t0 ? 1 + .35 * Math.sin(k * Math.PI) * (1 - k * .5) : 1}) rotate(${t > t0 ? (1 - oE(k)) * -40 : 0}deg)`;
    if (i === 4) s.style.filter = t > 4.8 ? `drop-shadow(0 0 ${10 * Math.exp(-(t - 4.8) * 3)}px #E9BC46)` : 'none'; });
  /* ---- D · la 5.ª estrella crece hasta llenarlo todo ---- */
  const kD = ioE(p(t, 5.3, .7)), G = $('granG');
  G.setAttribute('transform', `translate(${lerp(857, 540, kD)} ${lerp(1085, 960, kD)}) rotate(${kD * 144}) scale(${lerp(.3, 34, kD * kD)})`);
  $('gran').style.display = t > 5.3 && t < 6.1 ? 'block' : 'none';
  $('oro').style.display = t >= 6.0 && t < 7.8 ? 'block' : 'none';
  /* ---- E · UN TOQUE. ---- */
  const golpe = (el, t0) => { const k = muelle(t, t0, 2.6, .42); el.style.display = t > t0 - .02 && t < 7.8 ? 'block' : 'none'; el.style.transform = `scale(${lerp(1.7, 1, cl(k * 1.2)) * (1 + (k - 1) * .25)})`; el.style.filter = `blur(${(1 - cl(p(t, t0, .12))) * 16}px)`; el.style.opacity = cl((t - t0) * 12); };
  golpe($('un'), 6.05); golpe($('toque'), 6.4);
  const kl = oE(p(t, 6.85, .6)); $('listo').style.opacity = kl * (t < 7.8 ? 1 : 0); $('listo').style.transform = `translateY(${(1 - kl) * 40}px)`; $('listo').style.clipPath = `inset(0 ${100 - kl * 100}% 0 0)`;
  $('todo').style.transform = `scale(${drift * (t > 6.4 && t < 6.7 ? 1 + .02 * Math.sin(p(t, 6.4, .3) * Math.PI) : 1)})`;
  /* ---- F · la noche vuelve en círculo; ACERCA · TOCA · OPINA ---- */
  const kc = ioE(p(t, 7.35, .5)); $('noche2').style.clipPath = `circle(${kc * 1200}px at 540px 1020px)`; $('noche2').style.display = t > 7.35 ? 'block' : 'none';
  const pasos = [7.7, 8.5, 9.3], sal = [8.45, 9.25, 10.1];
  WS.forEach((w, i) => { const ki = oE(p(t, pasos[i], .5)), ko = iE(p(t, sal[i], .3)); w.style.transform = `translateY(${(1 - ki) * 110 - ko * 110}%)`; w.style.display = t > pasos[i] - .05 && t < sal[i] + .32 ? 'block' : 'none';
    const s = SB[i]; s.style.opacity = oE(p(t, pasos[i] + .15, .4)) * (1 - p(t, sal[i], .2)); s.style.transform = `translateY(${(1 - oE(p(t, pasos[i] + .15, .5))) * 20}px)`; s.style.display = t > 7 && t < 10.4 ? 'block' : 'none'; });
  // la bala: una estrella que gira 72° en cada palabra (muelle) y al final va al centro
  const giro = [7.7, 8.5, 9.3].reduce((a, t0) => a + 72 * cl(muelle(t, t0, 2.2, .45), -.2, 1.2), 0);
  const kb = oE(p(t, 7.55, .5)), kG = ioE(p(t, 10.15, .6)), kX = iE(p(t, 10.85, .35));
  $('balaG').setAttribute('transform', `translate(540 ${lerp(640, 845, kG)}) rotate(${giro + kG * 216}) scale(${kb * lerp(.9, 1.5, kG) * (1 - kX * .35)})`);
  $('bala').style.display = t > 7.5 && t < 11.25 ? 'block' : 'none';
  /* ---- G · marca ---- */
  AROS.forEach((c, i) => { const k = p(t, 11.2 + i * .1, 1.1); c.setAttribute('r', 150 + oE(k) * 800); c.setAttribute('stroke-width', 14 * (1 - k)); c.style.opacity = t > 11.2 + i * .1 && k < 1 ? 1 - k : 0; });
  const kM = oE(p(t, 11.2, .7)), mc = $('marca'); mc.style.opacity = t > 11.2 ? 1 : 0; mc.style.clipPath = `inset(0 ${50 - kM * 50}% 0 ${50 - kM * 50}%)`; mc.style.transform = `scale(${1.12 - .12 * kM})`; mc.style.filter = `blur(${(1 - kM) * 8}px)`;
  const k1 = oE(p(t, 11.95, .6)), k2 = oE(p(t, 12.2, .6)); $('l1').style.opacity = k1; $('l1').style.transform = `translateY(${(1 - k1) * 30}px)`; $('l2').style.opacity = k2; $('l2').style.transform = `translateY(${(1 - k2) * 30}px)`;
  // Estrellita sube con muelle y saluda
  const ks = muelle(t, 12.55, 2.2, .4), es = $('estre'), bob = t > 12.55 ? Math.sin((t - 12.55) * 5) * .03 * Math.exp(-(t - 12.55) * .8) : 0;
  es.style.opacity = t > 12.5 ? 1 : 0; es.style.transform = `translateY(${(1 - ks) * 520}px) scale(${1 + bob},${1 - bob}) rotate(${(1 - cl(ks)) * 14}deg)`;
  [$('marca'), $('l1'), $('l2')].forEach(e => e.style.display = t > 11 ? 'block' : 'none');
  // H · @plea5e.es tecleado
  const P = '@plea5e.es', np = Math.floor(cl((t - 13.5) * 14, 0, P.length)), pl = $('pill');
  pl.innerHTML = P.slice(0, np) + (t > 13.4 && Math.floor(t * 2.6) % 2 ? '<span class="car"></span>' : ''); pl.style.opacity = oE(p(t, 13.3, .4)); pl.style.transform = `translateY(${(1 - oE(p(t, 13.3, .5))) * 30}px)`;
  $('glow').style.opacity = t < 3.4 ? .6 + .4 * Math.sin(t * 2) : 1;
};
window.render(0); window.LISTO = true;
</script></body></html>
