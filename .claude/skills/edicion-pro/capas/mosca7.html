  if (onl) { const k = exp(p(t, 25.4, .4)); $('lista').style.opacity = k * (1 - p(t, 26.9, .2)); $('lista').style.transform = `scale(${.94 + .06 * k})`;
    [...$('listaIn').children].forEach((f, i) => { const a = 25.5 + i * .07, m2 = muelle(t, a, 2.2, .7); f.style.opacity = exp(p(t, a, .3)); f.style.transform = `translateY(${(1 - Math.min(m2, 1.04)) * 120}px)`; });
    $('listaIn').style.transform = `translateY(${-ioX(p(t, 26.3, .6)) * 160}px)`; }

  const c = CARA.find(([a, b]) => t >= a && t < b), cf = $('cara');

    const ei = a > 0 ? ioX(p(t, a, .35)) : 1, eo = b < TOTAL ? ioX(p(t, b - .3, .3)) : 0;

    let zs = 1 + .04 * p(t, a, b - a); [[9.62, 1.1], [18.8, 1.08], [28.85, 1.06], [.6, 1.06]].forEach(([g, e]) => { if (t >= g && g >= a && g < b) zs *= e; });
    $('caraZ').style.transform = `scale(${zs})`; await cara(t);
  } else cf.style.display = 'none';
};
