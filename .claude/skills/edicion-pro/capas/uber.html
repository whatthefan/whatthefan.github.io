<!doctype html>
<html><head><meta charset="utf-8"><script src="escena.js"></script><link rel="stylesheet" href="kit.css"><style>
.suelo{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(#dedcd6,#cfccc5)}
.ui{position:absolute;inset:0;background:#fff;font-family:Inter;color:#111}
.ui .mapa{position:absolute;left:0;right:0;top:0;height:470px;background:#eceef0}
.ui h3{position:absolute;left:0;right:0;top:560px;text-align:center;font-weight:800;font-size:46px;letter-spacing:-1.4px}
.ui p{position:absolute;left:0;right:0;top:630px;text-align:center;font-weight:500;font-size:28px;color:#6b6f76}
.ui .estrellas{position:absolute;left:0;right:0;top:710px;justify-content:center}
.ui .estrellas span{font-size:70px}
.ui .btn{position:absolute;left:40px;right:40px;bottom:50px;height:96px;border-radius:48px;background:#111;color:#fff;font-weight:700;font-size:34px;display:flex;align-items:center;justify-content:center}
.fila{display:flex;align-items:center;gap:32px;width:780px;padding:36px 40px}
.ico{flex:none;width:120px;height:120px;border-radius:30px;background:#efefed;display:flex;align-items:center;justify-content:center}
.fila h4{font-weight:800;font-size:46px;letter-spacing:-1.4px;margin-bottom:12px}
.fila .estrellas span{font-size:56px}
.fila small{display:block;font-weight:600;font-size:26px;color:#8a8d93;margin-bottom:6px}
.grande{height:110px;border-radius:56px;font-size:50px;padding:0 44px}
.medidor{position:absolute;left:190px;top:1280px;width:700px;height:34px;border-radius:17px;background:#d4d3cf;overflow:hidden}
.medidor b{position:absolute;left:0;top:0;bottom:0;background:#111;border-radius:17px}
</style></head><body>

<!-- 1 · valoración justo al bajarte -->
<div id="sVal" class="esc papel"><div class="cam">
  <div id="movil1" class="telefono" style="left:290px;top:560px;width:500px;height:1080px"><div class="pant"><div class="isla"></div>
    <div class="ui"><div class="mapa"><svg width="470" height="470" viewBox="0 0 470 470" fill="none" stroke="#d3d6da" stroke-width="16" stroke-linecap="round">
      <path d="M-10 130 H480 M-10 330 H480 M120 -10 V480 M340 -10 V480"/><path id="ruta" d="M60 400 C 120 330, 120 230, 230 230 S 340 130, 400 70" stroke="#111" stroke-width="10"/></svg>
      <svg id="coche" class="abs" viewBox="0 0 100 60" style="left:360px;top:40px;width:80px;height:48px"><rect x="6" y="18" width="88" height="28" rx="10" fill="#111"/><path d="M22 18 L32 4 H68 L78 18Z" fill="#111"/><circle cx="26" cy="48" r="9" fill="#E9BC46"/><circle cx="74" cy="48" r="9" fill="#E9BC46"/></svg></div>
      <h3>¿Qué tal tu viaje?</h3><p>Has llegado a tu destino</p>
      <div id="st1" class="estrellas"><span>★</span><span>★</span><span>★</span><span>★</span><span>★</span></div>
      <div class="btn">Enviar</div></div></div></div>
  <div id="chipJusto" class="pill" style="left:330px;top:1690px"><i></i>justo al acabar</div>
</div><div class="grano"></div></div>

<!-- 2 · las apps: pedido y estancia -->
<div id="sApps" class="esc papel"><div class="cam">
  <div id="c1" class="card fila" style="left:150px;top:720px"><div class="ico"><svg viewBox="0 0 60 60" width="70" height="70" fill="none" stroke="#111" stroke-width="4.5" stroke-linejoin="round"><path d="M12 20 H48 L45 52 H15 Z"/><path d="M22 20 V15 A8 8 0 0 1 38 15 V20"/></svg></div>
    <div><small>Pedido entregado</small><h4>Valora tu pedido</h4><div id="st2" class="estrellas"><span>★</span><span>★</span><span>★</span><span>★</span><span>★</span></div></div></div>
  <div id="c2" class="card fila" style="left:150px;top:1120px"><div class="ico"><svg viewBox="0 0 60 60" width="70" height="70" fill="none" stroke="#111" stroke-width="4.5" stroke-linejoin="round"><path d="M10 28 L30 11 L50 28 V51 H10 Z"/><path d="M25 51 V37 H35 V51" stroke="#D39B16"/></svg></div>
    <div><small>Hoy terminó tu estancia</small><h4>Valora tu estancia</h4><div id="st3" class="estrellas"><span>★</span><span>★</span><span>★</span><span>★</span><span>★</span></div></div></div>
</div><div class="grano"></div></div>

<!-- 3 · nunca a la semana siguiente -->
<div id="sSem" class="esc oscuro"><div class="cam">
  <div id="cal" class="card os" style="left:290px;top:760px;width:500px;height:520px;padding:0;overflow:hidden;text-align:center">
    <div style="height:120px;background:#E9BC46;color:#1a1204;font-weight:800;font-size:40px;letter-spacing:-1px;line-height:120px">Una semana después</div>
    <div style="font-weight:800;font-size:190px;letter-spacing:-9px;line-height:1;margin-top:60px">+7</div>
    <div style="font-weight:700;font-size:40px;color:rgba(255,255,255,.6);margin-top:18px">días</div></div>
  <div id="tacheCal" class="tache" style="left:230px;width:620px;top:1015px;height:16px;border-radius:8px;transform-origin:0 50%;rotate:-14deg"></div>
</div><div class="grano"></div></div>

<!-- 4 · fresco: el esfuerzo cae a cero -->
<div id="sFresco" class="esc papel"><div class="cam">
  <div id="cero" class="abs" style="left:0;right:0;top:640px;text-align:center;font-weight:800;font-size:520px;letter-spacing:-20px;line-height:1;color:#D39B16">0</div>
  <div id="lblEsf" class="abs" style="left:190px;top:1200px;font-weight:700;font-size:38px;color:#555;letter-spacing:-.6px">Esfuerzo</div>
  <div id="med" class="medidor"><b id="barra"></b></div>
</div><div class="grano"></div></div>

<!-- 5 · en la calle: el cliente se va y la petición llega tarde -->
<div id="sCalle" class="esc papel"><div class="cam">
  <div class="suelo" style="top:1560px"></div>
  <svg class="abs" style="left:0;top:0" width="1080" height="1920" fill="none" stroke="#141414" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
    <path id="puerta" d="M770 1560 V720 H1000 V1560"/><path id="suelo2" d="M40 1560 H1040"/></svg>
  <div id="pjCli" class="pj" style="left:260px;top:840px;width:370px;height:733px"><img src="cast/cliente-pie-Calm.svg"></div>
  <div id="bTarde" class="bocadillo" style="left:60px;top:760px">¿Nos dejas una reseña?</div>
</div><div class="grano"></div></div>

<!-- 6 · ¡pum! la placa: el momento exacto -->
<div id="sPlaca" class="esc papel"><div class="cam">
  <div class="suelo" style="top:1340px"></div>
  <svg class="abs" style="left:0;top:0" width="1080" height="1920"><path id="mesa" d="M60 1340 H1020" stroke="#141414" stroke-width="7" stroke-linecap="round" fill="none"/></svg>
  <div id="placa" class="abs sombra" style="left:310px;top:880px;width:460px;height:460px;transform-origin:50% 100%"><img src="w-placa.png" style="width:100%;height:100%"></div>
  <div id="chipAc" class="pill claro grande" style="left:250px;top:1470px">Acordarse<div id="tacheAc" class="tache" style="left:26px;right:26px;top:50px"></div></div>
  <div id="anillo" class="anillo"></div>
  <div id="movil" class="telefono" style="left:290px;top:560px;width:500px;height:1080px"><div class="pant"><div class="isla"></div><img id="pant" src="pan/pantalla-0.png"></div></div>
</div><div class="grano"></div></div>

<img id="selloMini" class="abs" src="sello-oro.svg" style="left:440px;top:1400px;width:200px;height:200px">
<div id="marca" class="marca">PLEA<b>5</b>E.es</div>
<div id="flash"></div>

<script src="kit.js"></script>
<script>
K.filtros();
const TOTAL = 30.58; window.TOTAL = TOTAL;
const ESC = [['sVal', 1.2, 4.5, true], ['sApps', 4.5, 9.6, false], ['sSem', 9.6, 11.9, false], ['sFresco', 14.6, 17.2, false], ['sCalle', 19.9, 21.9, false], ['sPlaca', 21.9, 27.5, false]];
const FLASH = [1.2, 19.9, 21.9];
const fAco = K.W('sin que nadie tenga que acordarse', 24.29, 25.5);
const TX = [
  { t0: 0, t1: 1.2, y: 1190, c: 'sub', s: [], b: K.W('¿Te has *fijado', .1, .6) },
  { t0: 1.22, t1: 2.9, y: 250, s: K.W('en que Uber te pide', 1.2, 2.0), b: K.W('la *valoración', 2.05, 2.5) },
  { t0: 2.97, t1: 4.5, y: 250, s: K.W('justo al', 2.97, 3.3), b: K.W('*bajarte del coche', 3.35, 4.1) },
  { t0: 4.6, t1: 7.1, y: 250, s: K.W('y Glovo, cuando llega', 4.62, 5.9), b: K.W('la *comida', 6.0, 6.4) },
  { t0: 7.17, t1: 9.6, y: 250, s: K.W('y Airbnb,', 7.19, 7.7), b: K.W('el día que te *vas', 8.31, 9.1) },
  { t0: 9.65, t1: 11.9, y: 330, c: 'claro', s: K.W('nunca a la', 9.73, 10.3), b: K.W('semana siguiente', 10.4, 11.3) },
  { t0: 11.93, t1: 12.72, y: 1190, c: 'sub', s: [], b: K.W('¿Por *qué?', 11.96, 12.2) },
  { t0: 12.75, t1: 14.6, y: 1190, c: 'sub', s: K.W('porque en ese momento', 12.77, 13.7), b: K.W('*todavía', 13.75, 14.1) },
  { t0: 14.62, t1: 15.9, y: 300, s: K.W('lo tienes', 14.61, 15.0), b: K.W('*fresco', 15.05, 15.5) },
  { t0: 15.92, t1: 17.2, y: 300, s: K.W('y te cuesta', 15.95, 16.4), b: K.W('*cero', 16.45, 16.8) },
  { t0: 17.25, t1: 17.98, y: 1190, c: 'sub', s: K.W('¿Y tu', 17.3, 17.45), b: K.W('bar?', 17.5, 17.66) },
  { t0: 18.0, t1: 19.9, y: 1190, c: 'sub', s: K.W('¿cuándo pide la reseña?', 18.01, 19.0), b: [['Nunca.', 19.28, 'rojo']] },
  { t0: 19.95, t1: 21.9, y: 250, s: K.W('o cuando el cliente', 20.17, 20.8), b: K.W('está en la *calle', 20.85, 21.4) },
  { t0: 21.95, t1: 24.2, y: 250, s: K.W('con esto la pides en el', 22.01, 23.0), b: K.W('momento *exacto', 23.05, 23.9) },
  { t0: 24.29, t1: 25.85, y: 250, s: fAco.slice(0, 5), b: fAco.slice(5) },
  { t0: 25.88, t1: 27.5, y: 250, s: K.W('acercan el móvil', 25.9, 26.6), b: K.W('y *listo', 26.7, 27.0) },
  { t0: 27.55, t1: 28.55, y: 150, c: 'sub', s: K.W('esto es', 27.63, 27.85), b: [['PLEA5E', 27.9]] },
  { t0: 28.6, t1: TOTAL + 1, y: 150, c: 'sub', s: K.W('y si te interesa,', 28.67, 29.3), b: K.W('comenta *PLACA', 29.35, 29.9) },
];
K.textos(TX);

window.render = t => {
  K.escenas(ESC, t);
  TX.forEach(B => K.texto(B, t));
  $('flash').style.opacity = Math.max(...FLASH.map(f => K.destello(t, f)));
  const cara = !ESC.some(([, a, b]) => t >= a && t < b);
  $('marca').style.display = cara && t < 27.5 ? 'block' : 'none';

  // 1 · valoración — entrada: el móvil · acción: el coche llega, las estrellas se rellenan · remate: «justo al acabar»
  if (t >= 1.2 && t < 4.5) {
    entra($('movil1'), t, 1.22, { y: 260, s: .9, tipo: 'muelle', f: 1.8, z: .7 });
    $('movil1').style.transform += flota(t, 0, 5);
    const k = ease.inOut(p(t, 1.3, 1.0)), ruta = $('ruta'), L = ruta.getTotalLength(), pt = ruta.getPointAtLength(L * k);
    traza(ruta, t, 1.3, 1.0);
    $('coche').style.transform = `translate(${pt.x - 400}px,${pt.y - 64}px)`;
    K.estrellas($('st1'), t, 2.4, .6);
    K.pop($('chipJusto'), t, 3.35);
  }
  // 2 · apps — cada tarjeta llega en su nombre y se valora en su momento
  if (t >= 4.5 && t < 9.6) {
    K.pop($('c1'), t, 4.62, { y: 80, s: .9, f: 2.2, z: .6 }); K.estrellas($('st2'), t, 5.9, .55);
    K.pop($('c2'), t, 7.19, { y: 80, s: .9, f: 2.2, z: .6 }); K.estrellas($('st3'), t, 8.5, .55);
    $('c1').style.opacity = t < 4.62 ? 0 : 1 - .4 * p(t, 7.1, .25);
  }
  // 3 · semana — el +7 se tacha en «nunca»
  if (t >= 9.6 && t < 11.9) {
    K.pop($('cal'), t, 9.65, { y: 60, s: .88 }); $('cal').style.transform += ` rotate(-3deg)` + flota(t, 1, 5);
    K.tache($('tacheCal'), t, 10.55);
    $('cal').style.opacity = t < 9.65 ? 0 : 1 - .45 * p(t, 10.65, .2);
  }
  // 4 · fresco — el esfuerzo cae a cero
  if (t >= 14.6 && t < 17.2) {
    entra($('lblEsf'), t, 14.7, { y: 20 }); entra($('med'), t, 14.75, { y: 20, s: 1 });
    const cae = ease.outExpo(p(t, 16.0, .45)); $('barra').style.width = (86 * (1 - cae)) + '%';
    K.pop($('cero'), t, 16.35, { y: 40, s: .4, f: 2.2, z: .5 });
  }
  // 5 · calle — el cliente sale por la puerta; la petición llega tarde y se apaga
  if (t >= 19.9 && t < 21.9) {
    traza($('suelo2'), t, 19.92, .3); traza($('puerta'), t, 20.0, .45);
    const k = ease.inOut(p(t, 20.3, 1.1)); $('pjCli').style.opacity = 1;
    $('pjCli').style.transform = `translateX(${k * 760}px) translateY(${-Math.abs(Math.sin(k * Math.PI * 5)) * 16}px)`;
    K.pop($('bTarde'), t, 21.05);
    $('bTarde').style.opacity = t < 21.05 ? 0 : 1 - .6 * p(t, 21.4, .35);
  }
  // 6 · placa — cae en «con esto», «acordarse» se tacha, llega el móvil, toca y se abre la reseña
  if (t >= 21.9 && t < 27.5) {
    traza($('mesa'), t, 21.92, .35);
    const kp = p(t, 22.0, .3) ** 2, sq = t >= 22.3 ? (1 - muelle(t, 22.3, 3, .4)) : 0;
    const baja = ease.inCubic(p(t, 26.4, .35));
    $('placa').style.opacity = t < 22.0 ? 0 : 1 - .75 * baja;
    $('placa').style.transform = `translateY(${-(1 - kp) * 700 + baja * 80}px) scale(${1 - .06 * sq},${1 - .12 * sq})`;
    K.pop($('chipAc'), t, 24.5); K.tache($('tacheAc'), t, 25.3);
    $('chipAc').style.opacity = t < 24.5 ? 0 : (1 - .45 * p(t, 25.4, .2)) * (1 - p(t, 25.85, .2));
    const k1 = ease.inOut(p(t, 25.88, .5)), k2 = ease.inOut(p(t, 26.4, .4));
    const dx = 760 + (60 - 760) * k1 + (0 - 60) * k2, dy = 520 + (-40 - 520) * k1 + (20 + 40) * k2;
    const s = (.62 + .38 * k2) * golpe(t, 26.15, .05), r = -10 * k1 * (1 - k2) + 14 * (1 - k1);
    $('movil').style.opacity = t >= 25.88 ? 1 : 0;
    $('movil').style.transform = `translate(${dx}px,${dy}px) scale(${s}) rotate(${r}deg)`;
    K.anillo($('anillo'), t, 26.15, 520, 1110);
    K.pantalla($('pant'), t, 26.7, .7);
  }
  // cierre — sello pequeño bajo el PLEA5E
  $('selloMini').style.display = 'none';
};
window.render(0); window.LISTO = true;
</script></body></html>
