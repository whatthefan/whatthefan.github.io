<script>
const $ = id => document.getElementById(id);
const { p, ease, muelle, golpe, entra, camara, salida, traza, cursor, teclea, caras, flota } = E;
const TOTAL = 19.4; window.TOTAL = TOTAL;
// escenas: [id, entra, sale, sale con desenfoque (true) o corte seco]
const ESC = [['sQR', 1.767, 3.433, false], ['sMot', 4.5, 6.033, true], ['sCol', 6.033, 8.233, true], ['sWa', 8.233, 11.733, true], ['sSola', 11.733, 13.267, true], ['sEq', 13.267, 17.4, false]];
const FLASH = [1.767, 4.5];
// filtro de salida por escena
const FB = {};
ESC.forEach(([id]) => { const f = document.createElementNS('http://www.w3.org/2000/svg', 'filter'); f.id = 'fx' + id;
  f.setAttribute('x', '-10%'); f.setAttribute('y', '-30%'); f.setAttribute('width', '120%'); f.setAttribute('height', '160%');
  f.innerHTML = '<feGaussianBlur stdDeviation="0 0"/>'; $('filtros').appendChild(f); FB[id] = f.firstChild; });

const TX = [

  { t0: 1.8, t1: 3.433, y: 300, c: '', s: [['tenemos', 1.8], ['el', 2.28]], b: [['QR', 2.53, 'oro'], ['también', 2.77]] },
  { t0: 3.433, t1: 4.5, y: 1190, c: 'sub', s: [['¿y', 3.39], ['por', 3.54], ['qué', 3.78]], b: [['nosotros?', 4.02]] },
  { t0: 4.52, t1: 6.033, y: 400, c: 'claro', s: [['por', 4.52], ['tres', 4.74], ['simples', 5.02]], b: [['motivos', 5.46]] },
  { t0: 6.05, t1: 8.233, y: 300, c: '', bs: 112, s: [['la', 6.05], ['diseñamos', 6.17], ['con', 6.67], ['tu', 6.89]], b: [['logo', 7.07], ['y', 7.34], ['tus', 7.48], ['colores', 7.7, 'oro']] },
  { t0: 8.25, t1: 9.42, y: 280, c: 'claro', s: [['el', 8.25], ['diseño', 8.38], ['es', 8.74]], b: [['gratis', 8.93, 'oro']] },
  { t0: 9.44, t1: 11.733, y: 280, c: 'claro', s: [['no', 9.44], ['se', 9.62], ['imprime', 9.8], ['nada', 10.22]], b: [['hasta', 10.49], ['que', 10.82], ['te', 11.05], ['guste', 11.23, 'oro']] },
  { t0: 11.75, t1: 13.267, y: 330, c: '', s: [['no', 11.75], ['te', 11.85], ['mandamos', 12.01], ['una', 12.41]], b: [['placa', 12.61, 'oro'], ['y', 12.89], ['ya', 13.01]], id: 'txSola' },
  { t0: 13.3, t1: 15.3, y: 300, c: '', s: [['te', 13.37], ['enseñamos', 13.57], ['a', 14.11], ['ti', 14.26], ['y', 14.45], ['a', 14.6], ['tu', 14.74]], b: [['equipo', 14.94, 'oro']] },
  { t0: 15.33, t1: 17.4, y: 300, c: '', s: [['cuándo', 15.33], ['y', 15.73], ['cómo', 15.87], ['pedir', 16.17]], b: [['las', 16.51], ['reseñas', 16.75, 'oro']] },

];
let nf = 0;
TX.forEach(B => {
  const el = document.createElement('div'); el.className = 'tb ' + B.c; el.style.top = B.y + 'px'; if (B.id) el.id = B.id;
  const linea = (ws, cls) => '<div class="' + cls + '">' + ws.map(([w, t, x]) => `<span class="w ${x || ''}" data-t="${t}">` + [...w].map(ch => `<span class="l">${ch}</span>`).join('') + '</span>').join(' ') + '</div>';
  el.innerHTML = (B.s.length ? linea(B.s, 's') : '') + (B.b.length ? linea(B.b, 'b') : '');
  if (B.bs) el.querySelector('.b').style.fontSize = B.bs + 'px';
  const f = document.createElementNS('http://www.w3.org/2000/svg', 'filter'); f.id = 'sm' + nf;
  f.setAttribute('x', '-20%'); f.setAttribute('y', '-100%'); f.setAttribute('width', '140%'); f.setAttribute('height', '300%');
  f.innerHTML = '<feGaussianBlur stdDeviation="0 0"/>'; $('filtros').appendChild(f);
  B.el = el; B.fb = f.firstChild; B.fid = 'sm' + nf++; $('textos').appendChild(el);
});
function texto(B, t) {
  const vis = t >= B.t0 - .02 && t < B.t1; B.el.style.display = vis ? 'block' : 'none'; if (!vis) return;
  const k = ease.inCubic(p(t, B.t1 - .16, .16));

  B.el.querySelectorAll('.w').forEach(w => { const tw = +w.dataset.t;

      l.style.opacity = e; l.style.filter = `blur(${(1 - e) * 12}px)`; l.style.transform = `translateY(${(1 - e) * 10}px)`; }); });
}
function destello(t, t0) { const u = t - t0; if (u < -.07 || u > .22) return 0; return u < 0 ? ease.outCubic(1 + u / .07) : 1 - ease.outCubic(u / .22); }
