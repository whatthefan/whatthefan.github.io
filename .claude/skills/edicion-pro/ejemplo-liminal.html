<script>
const $ = id => document.getElementById(id);
const cl = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const p = (t, t0, d) => cl((t - t0) / d);
const oExpo = x => x >= 1 ? 1 : 1 - Math.pow(2, -10 * x);
const oCub = x => 1 - Math.pow(1 - x, 3), iCub = x => x * x * x;
const ioCub = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const TOTAL = 19.4; window.TOTAL = TOTAL;

const ESC = [['sQR', 1.767, 3.433], ['sMot', 4.5, 6.033], ['sCol', 6.033, 8.233], ['sWa', 8.233, 11.733], ['sSola', 11.733, 13.267], ['sGuia', 13.267, 17.4]];
const FLASH = [1.767, 4.5, 13.267];

/* personaje: Estrellita (el 5 nunca en espejo: se usan los SVG -izq, no transform) */
const POSES = ['anda-0', 'anda-1', 'anda-2', 'anda-3', 'anda-4', 'anda-5', 'anda-6', 'anda-7', 'senala', 'pulgar', 'saluda'];
['estQR', 'estG'].forEach(id => $(id).innerHTML = POSES.map(n => `<img data-p="${n}" src="estrellita/${n}.svg">`).join(''));
function pose(el, n) { el.querySelectorAll('img').forEach(i => i.style.display = i.dataset.p === n ? 'block' : 'none'); }
/* camina de x0 a x1 entre t0 y t1 y luego se queda en «final» */
function personaje(el, t, t0, t1, x0, x1, final) {
  if (t < t0) { el.style.opacity = 0; return; }
  el.style.opacity = 1;
  const k = p(t, t0, t1 - t0);
  el.style.left = (x0 + (x1 - x0) * k) + 'px';
  if (t < t1) { pose(el, 'anda-' + (Math.floor((t - t0) * 12) % 8)); el.style.transform = `translateY(${Math.abs(Math.sin((t - t0) * Math.PI * 3)) * -8}px)`; }
  else { pose(el, final); const b = oExpo(p(t, t1, .3)); el.style.transform = `scale(${1 + (1 - b) * .06})`; }
}

const TX = [
  { t0: 0, t1: 1.767, y: 1190, c: 'sub', s: [['si', .08], ['alguien', .24], ['tiene', .59], ['un', .87]], b: [['móvil', 1.02], ['antiguo', 1.3]] },
  { t0: 1.8, t1: 3.433, y: 300, c: '', s: [['tenemos', 1.8], ['el', 2.28]], b: [['QR', 2.53, 'oro'], ['también', 2.77]] },
  { t0: 3.433, t1: 4.5, y: 1190, c: 'sub', s: [['¿y', 3.39], ['por', 3.54], ['qué', 3.78]], b: [['nosotros?', 4.02]] },
  { t0: 4.52, t1: 6.033, y: 400, c: 'claro', s: [['por', 4.52], ['tres', 4.74], ['simples', 5.02]], b: [['motivos', 5.46]] },
  { t0: 6.05, t1: 8.233, y: 300, c: '', s: [['la', 6.05], ['diseñamos', 6.17], ['con', 6.67], ['tu', 6.89]], b: [['logo', 7.07], ['y', 7.34], ['tus', 7.48], ['colores', 7.7, 'oro']], bs: 112 },
  { t0: 8.25, t1: 9.42, y: 280, c: 'claro', s: [['el', 8.25], ['diseño', 8.38], ['es', 8.74]], b: [['gratis', 8.93, 'oro']] },
  { t0: 9.44, t1: 11.733, y: 280, c: 'claro', s: [['no', 9.44], ['se', 9.62], ['imprime', 9.8], ['nada', 10.22]], b: [['hasta', 10.49], ['que', 10.82], ['te', 11.05], ['guste', 11.23, 'oro']] },
  { t0: 11.75, t1: 13.267, y: 330, c: '', s: [['no', 11.69], ['te', 11.85], ['mandamos', 12.01], ['una', 12.41]], b: [['placa', 12.61, 'oro'], ['y', 12.89], ['ya', 13.01]] },
  { t0: 13.3, t1: 15.3, y: 300, c: '', s: [['te', 13.37], ['enseñamos', 13.57], ['a', 14.11], ['ti', 14.26], ['y', 14.45], ['a', 14.6], ['tu', 14.74]], b: [['equipo', 14.94, 'oro']] },
  { t0: 15.33, t1: 17.4, y: 300, c: '', s: [['cuándo', 15.33], ['y', 15.73], ['cómo', 15.87], ['pedir', 16.17]], b: [['las', 16.51], ['reseñas', 16.75, 'oro']] },
  { t0: 17.4, t1: TOTAL, y: 1190, c: 'sub', s: [['lo', 17.69], ['que', 17.83], ['de', 18.01], ['verdad', 18.16], ['marca', 18.45]], b: [['la', 18.7], ['diferencia', 18.84]] },
];
const cont = $('textos'); let nf = 0;
TX.forEach(B => {
  const el = document.createElement('div'); el.className = 'tb ' + B.c; el.style.top = B.y + 'px';
  const linea = (ws, cls) => '<div class="' + cls + '">' + ws.map(([w, t, x]) =>
    `<span class="w ${x || ''}" data-t="${t}">` + [...w].map(ch => `<span class="l">${ch}</span>`).join('') + '</span>').join(' ') + '</div>';
  el.innerHTML = (B.s.length ? linea(B.s, 's') : '') + (B.b.length ? linea(B.b, 'b') : '');
  if (B.bs) el.querySelector('.b').style.fontSize = B.bs + 'px';
  const f = document.createElementNS('http://www.w3.org/2000/svg', 'filter'); f.id = 'sm' + nf;
  f.setAttribute('x', '-20%'); f.setAttribute('y', '-100%'); f.setAttribute('width', '140%'); f.setAttribute('height', '300%');
  f.innerHTML = '<feGaussianBlur stdDeviation="0 0"/>'; $('filtros').appendChild(f);
  B.el = el; B.fb = f.firstChild; B.fid = 'sm' + nf++; cont.appendChild(el);
});
function texto(B, t) {
  const vis = t >= B.t0 - .02 && t < B.t1; B.el.style.display = vis ? 'block' : 'none'; if (!vis) return;
  const k = p(t, B.t1 - .16, .16);
  B.fb.setAttribute('stdDeviation', `0 ${iCub(k) * 26}`);
  B.el.style.filter = k > 0 ? `url(#${B.fid})` : 'none';
  B.el.style.opacity = 1 - iCub(k); B.el.style.transform = `translateY(${-iCub(k) * 40}px)`;
  B.el.querySelectorAll('.w').forEach(w => { const tw = +w.dataset.t;
    w.querySelectorAll('.l').forEach((l, i) => { const e = oCub(p(t, tw + i * .018, .24));
      l.style.opacity = e; l.style.filter = `blur(${(1 - e) * 12}px)`; l.style.transform = `translateY(${(1 - e) * 10}px)`; }); });
}
function entra(el, t, t0, d = .45) { const e = oExpo(p(t, t0, d)); el.style.opacity = t < t0 ? 0 : e; el.style.filter = `blur(${(1 - e) * 16}px)`; return e; }

window.render = t => {

    const u = t - 1.767;
    $('camQR').style.transform = `scale(${1.02 + u * .035}) translateX(${-u * 10}px)`;
    const e = oExpo(p(t, 1.8, .5)); $('qrPlaca').style.transform = `rotate(-2deg) translateY(${(1 - e) * -40}px)`;
    personaje($('estQR'), t, 1.8, 2.5, -420, 170, 'senala');

    $('qrEsc').style.transform = `scale(${1.25 - .25 * oExpo(p(t, 2.53, .3))})`;
    $('qrLinea').style.top = (ioCub(s) * 76) + 'px'; $('qrLinea').style.opacity = s < 1 ? 1 : 0;
