<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Pedidos · PLEA5E</title>
<!--
  El panel de pedidos. Esta pagina NO es publica: pide contrasena y el
  netlify.toml le pone cabecera de "no me indexes". La contrasena no se
  comprueba aqui —eso seria de mentira, cualquiera abre el codigo— sino
  en la funcion del servidor, que sin ella no devuelve ni una letra.
-->
<style>
  :root{
    --noche:#06080E; --panel:#0F1522; --panel-2:#141B2B;
    --borde:#1C2536; --borde-claro:#2A3448;
    --txt:#EAEDF4; --txt-2:#8B95AB; --txt-3:#5D6679;
    --oro:#E9BC46; --oro-cl:#F8E1A6;
    --verde:#3BB273; --rojo:#D9534F;
    --r:8px;
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--noche); color:var(--txt);
    font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-text-size-adjust:100%;
  }
  .caja{max-width:820px; margin:0 auto; padding:20px 16px 80px}

  header.top{
    display:flex; align-items:center; gap:12px; flex-wrap:wrap;
    padding:16px 0 20px; border-bottom:1px solid var(--borde); margin-bottom:20px;
  }
  header.top h1{margin:0; font-size:19px; letter-spacing:.14em; text-transform:uppercase}
  header.top h1 b{color:var(--oro); font-weight:800}
  .crece{flex:1 1 auto}

  button,.btn{
    font:inherit; font-weight:600; cursor:pointer; border-radius:999px;
    border:1px solid var(--borde-claro); background:var(--panel-2); color:var(--txt);
    padding:9px 16px; text-decoration:none; display:inline-flex; align-items:center; gap:7px;
  }
  button:hover,.btn:hover{border-color:var(--txt-3)}
  .btn-oro{background:var(--oro); color:#100B00; border-color:var(--oro)}
  .btn-oro:hover{background:var(--oro-cl); border-color:var(--oro-cl)}
  .chico{padding:6px 12px; font-size:14px}

  input,textarea{
    font:inherit; width:100%; padding:12px 14px; border-radius:var(--r);
    border:1px solid var(--borde-claro); background:var(--panel); color:var(--txt);
  }
  input:focus{outline:2px solid var(--oro); outline-offset:1px}

  /* ---- la puerta ---- */
  .puerta{max-width:380px; margin:14vh auto 0; text-align:center}
  .puerta h2{font-size:20px; margin:0 0 6px}
  .puerta p{color:var(--txt-2); font-size:14px; margin:0 0 20px}
  .puerta .fila{display:flex; gap:8px; margin-bottom:12px}
  .puerta .fila input{flex:1 1 auto}
  .recuerda{font-size:13px; color:var(--txt-3); display:flex; gap:7px; align-items:flex-start; text-align:left}
  .recuerda input{width:auto; flex:0 0 auto; margin-top:3px}

  /* ---- filtros ---- */
  .filtros{display:flex; gap:7px; flex-wrap:wrap; margin-bottom:18px}
  .filtros button.on{background:var(--oro); color:#100B00; border-color:var(--oro)}

  /* ---- una ficha ---- */
  .ficha{
    background:var(--panel); border:1px solid var(--borde); border-radius:12px;
    padding:16px 16px 14px; margin-bottom:14px;
  }
  .ficha.hecho{opacity:.55}
  .ficha.descartado{opacity:.4}
  .ficha .cab{display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; margin-bottom:2px}
  .ficha h3{margin:0; font-size:18px; line-height:1.25}
  .ref{font-size:12px; color:var(--txt-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  .sello{
    font-size:11px; text-transform:uppercase; letter-spacing:.09em; font-weight:700;
    padding:3px 9px; border-radius:999px; border:1px solid currentColor;
  }
  .sello.nuevo{color:var(--oro)}
  .sello.hecho{color:var(--verde)}
  .sello.descartado{color:var(--txt-3)}
  .cuando{font-size:13px; color:var(--txt-3); margin:0 0 12px}

  .datos{border-collapse:collapse; font-size:14px; margin-bottom:12px; width:100%}
  .datos td{padding:3px 0; vertical-align:top}
  .datos td:first-child{color:var(--txt-2); padding-right:14px; white-space:nowrap; width:1%}
  .datos a{color:var(--oro-cl)}
  .notas{
    background:var(--panel-2); border-left:3px solid var(--borde-claro);
    padding:10px 12px; border-radius:0 var(--r) var(--r) 0; margin:0 0 12px;
    font-size:14px; white-space:pre-wrap; word-break:break-word;
  }
  .porque{
    background:rgba(233,188,70,.07); border-left:3px solid var(--oro);
    padding:10px 12px; border-radius:0 var(--r) var(--r) 0; margin:0 0 12px; font-size:14px;
  }
  .colores{display:flex; gap:6px; margin:8px 0 0}
  .colores i{
    width:26px; height:26px; border-radius:6px; display:block;
    border:1px solid rgba(255,255,255,.18);
  }
  .acciones{display:flex; gap:8px; flex-wrap:wrap; margin-top:4px}

  .vacio{text-align:center; color:var(--txt-2); padding:50px 20px; font-size:15px}
  .aviso{
    background:rgba(217,83,79,.12); border:1px solid rgba(217,83,79,.45);
    color:#F6C9C7; padding:12px 14px; border-radius:var(--r); font-size:14px; margin-bottom:16px;
  }
  .oculto{display:none !important}
</style>
</head>
<body>

<div class="caja">

  <!-- ═══ la puerta ═══ -->
  <section id="puerta" class="puerta">
    <h2>Pedidos <span style="color:var(--oro)">PLEA5E</span></h2>
    <p>Esta parte no es pública. Escribe la contraseña.</p>
    <form id="fClave">
      <div class="fila">
        <input id="clave" type="password" placeholder="Contraseña" autocomplete="current-password" autofocus>
        <button class="btn-oro" type="submit">Entrar</button>
      </div>
      <label class="recuerda">
        <input type="checkbox" id="recuerda" checked>
        <span>Recordarla en este aparato. No la marques en un ordenador que no sea tuyo.</span>
      </label>
    </form>
    <div id="errClave" class="aviso oculto" style="margin-top:16px"></div>
  </section>

  <!-- ═══ el panel ═══ -->
  <div id="panel" class="oculto">
    <header class="top">
      <h1><b>PLEA5E</b> · Pedidos</h1>
      <span class="crece"></span>
      <button class="chico" id="refrescar">Actualizar</button>
      <button class="chico" id="salir">Salir</button>
    </header>

    <div id="errPanel" class="aviso oculto"></div>

    <div class="filtros">
      <button data-f="nuevo" class="chico on">Nuevos <span data-n="nuevo"></span></button>
      <button data-f="hecho" class="chico">Hechos <span data-n="hecho"></span></button>
      <button data-f="descartado" class="chico">Descartados <span data-n="descartado"></span></button>
      <button data-f="todo" class="chico">Todos <span data-n="todo"></span></button>
    </div>

    <div id="lista"></div>
  </div>

</div>

<script>
(function () {
  'use strict';

  var API   = '/api/encargos';
  var GUARD = 'plea5e_panel_clave';
  var clave = '';
  var todo  = [];
  var filtro = 'nuevo';

  var $ = function (id) { return document.getElementById(id); };
  function ver(el, si) { el.classList.toggle('oculto', !si); }
  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  /* ---------- entrar ---------- */

  function guardada() {
    try { return localStorage.getItem(GUARD) || ''; } catch (e) { return ''; }
  }

  $('fClave').addEventListener('submit', function (e) {
    e.preventDefault();
    var v = $('clave').value.trim();
    if (!v) return;
    probar(v, $('recuerda').checked);
  });

  function probar(v, recordar) {
    ver($('errClave'), false);
    pedir(v).then(function (d) {
      clave = v;
      if (recordar) { try { localStorage.setItem(GUARD, v); } catch (e) {} }
      ver($('puerta'), false);
      ver($('panel'), true);
      pinta(d.lista || []);
    }).catch(function (err) {
      $('errClave').textContent = err.message;
      ver($('errClave'), true);
      $('clave').value = '';
      $('clave').focus();
    });
  }

  $('salir').addEventListener('click', function () {
    try { localStorage.removeItem(GUARD); } catch (e) {}
    location.reload();
  });

  /* ---------- hablar con el servidor ---------- */

  /* La contrasena va en una cabecera, nunca en la direccion: lo que va en
     la direccion se queda en el historial del navegador y en los registros
     del servidor. */
  function pedir(v) {
    return fetch(API, { headers: { 'x-panel-clave': v }, cache: 'no-store' })
      .then(function (r) {
        if (r.status === 401) throw new Error('Esa contraseña no es.');
        if (r.status === 500) {
          return r.json().catch(function () { return {}; }).then(function (d) {
            if (/PANEL_CLAVE/.test(d.error || '')) {
              throw new Error('Falta poner PANEL_CLAVE en las variables de Netlify.');
            }
            /* El detalle que manda el servidor, tal cual. Decir solo "el
               servidor ha fallado" obliga a ir a buscar los registros de
               Netlify, y eso desde el móvil es una odisea. */
            throw new Error(d.error || 'El servidor ha fallado y no ha dicho por qué.');
          });
        }
        if (!r.ok) throw new Error('No he podido leer los pedidos (' + r.status + ').');
        return r.json();
      })
      .catch(function (err) {
        if (err instanceof TypeError) {
          throw new Error('No hay respuesta del servidor. ¿Estás en plea5e.es y no en un archivo suelto?');
        }
        throw err;
      });
  }

  function marcar(item, estado, boton) {
    boton.disabled = true;
    fetch(API, {
      method: 'POST',
      headers: { 'x-panel-clave': clave, 'Content-Type': 'application/json' },
      body: JSON.stringify({ clave: item.clave, estado: estado })
    }).then(function (r) {
      if (!r.ok) throw new Error('no');
      item.estado = estado;
      pinta(todo);
    }).catch(function () {
      boton.disabled = false;
      $('errPanel').textContent = 'No se ha podido guardar el cambio. Prueba otra vez.';
      ver($('errPanel'), true);
    });
  }

  $('refrescar').addEventListener('click', function () {
    var b = this;
    b.disabled = true;
    ver($('errPanel'), false);
    pedir(clave).then(function (d) { pinta(d.lista || []); })
      .catch(function (err) { $('errPanel').textContent = err.message; ver($('errPanel'), true); })
      .then(function () { b.disabled = false; });
  });

  /* ---------- los filtros ---------- */

  [].forEach.call(document.querySelectorAll('.filtros button'), function (b) {
    b.addEventListener('click', function () {
      filtro = b.dataset.f;
      [].forEach.call(document.querySelectorAll('.filtros button'), function (o) {
        o.classList.toggle('on', o === b);
      });
      pinta(todo);
    });
  });

  /* ---------- pintar ---------- */

  function fecha(ms) {
    var d = new Date(ms || 0);
    if (isNaN(d.getTime())) return '';
    var dos = function (n) { return (n < 10 ? '0' : '') + n; };
    return dos(d.getDate()) + '/' + dos(d.getMonth() + 1) + '/' + d.getFullYear() +
           ' · ' + dos(d.getHours()) + ':' + dos(d.getMinutes());
  }

  /* Un telefono espanol de nueve cifras necesita el 34 delante para que
     wa.me lo abra. Si ya trae prefijo, se deja como esta. */
  function whats(tel) {
    var n = String(tel || '').replace(/\D/g, '');
    if (!n) return '';
    if (n.length === 9) n = '34' + n;
    return 'https://wa.me/' + n;
  }

  /* El pedido en palabras. Ahora puede llevar varios productos, así que
     se lee de 'lineas'; los encargos de antes solo traen formato y
     cantidad sueltos y se leen igual de bien. */
  /* Dónde se quedó el cliente. Ojo, esto NO es el estado del taller
     (nuevo / hecho / descartado), que sigue siendo tuyo y lo marcas tú:
     esto lo pone él con lo que hace en la web. */
  var PASOS = {
    'sin-pagar': 'Se fue a pagar y no ha vuelto',
    'pagado':    'Fianza pagada',
    'llamada':   'Quiere que le llames antes de pagar',
    'enviado':   'Enviado por WhatsApp'
  };
  var NOMBRES  = { placa:'placa de mesa',  stand:'expositor de pie',  tarjeta:'tarjeta de mano' };
  var PLURALES = { placa:'placas de mesa', stand:'expositores de pie', tarjeta:'tarjetas de mano' };
  function resumen(e) {
    var ls = (e && e.lineas && e.lineas.length) ? e.lineas
           : (e && e.formato ? [{ formato:e.formato, cantidad:e.cantidad }] : []);
    return ls.map(function (l) {
      var n = +l.cantidad || 1;
      var nombre = (n === 1 ? NOMBRES[l.formato] : PLURALES[l.formato]) || l.formato;
      if (l.formato !== 'tarjeta' && n >= 20) return '20 o más ' + nombre;
      return n + ' ' + nombre;
    }).join(' + ');
  }

  function fila(k, v, enlace) {
    if (!v) return '';
    var dentro = enlace ? '<a href="' + esc(enlace) + '" target="_blank" rel="noopener">' + esc(v) + '</a>'
                        : esc(v);
    return '<tr><td>' + k + '</td><td>' + dentro + '</td></tr>';
  }

  function pinta(lista) {
    todo = lista || [];
    var cuenta = { nuevo: 0, hecho: 0, descartado: 0, todo: todo.length };
    todo.forEach(function (i) {
      if (cuenta[i.estado] !== undefined) cuenta[i.estado]++;
    });
    Object.keys(cuenta).forEach(function (k) {
      var e = document.querySelector('[data-n="' + k + '"]');
      if (e) e.textContent = cuenta[k] ? '(' + cuenta[k] + ')' : '';
    });

    var ver_ = todo.filter(function (i) { return filtro === 'todo' || i.estado === filtro; });
    var caja = $('lista');

    if (!ver_.length) {
      caja.innerHTML = '<p class="vacio">' + (todo.length
        ? 'Nada por aquí con ese filtro.'
        : 'Todavía no ha entrado ningún pedido.<br>En cuanto alguien pague la fianza, aparece solo.') + '</p>';
      return;
    }

    caja.innerHTML = ver_.map(function (i) {
      var e = i.encargo || {};
      var b = i.brief || {};
      var estado = i.estado || 'nuevo';
      var wa = whats(e.tel);
      var colores = ['banda', 'fondo', 'acento']
        .filter(function (k) { return b[k]; })
        .map(function (k) { return '<i style="background:' + esc(b[k]) + '" title="' + k + ' ' + esc(b[k]) + '"></i>'; })
        .join('');

      return '' +
        '<article class="ficha ' + estado + '" data-c="' + esc(i.clave) + '">' +
          '<div class="cab">' +
            '<h3>' + esc(e.negocio || 'Sin nombre') + '</h3>' +
            '<span class="sello ' + estado + '">' + estado + '</span>' +
            '<span class="crece"></span>' +
            '<span class="ref">' + esc(i.ref || '') + '</span>' +
          '</div>' +
          '<p class="cuando">' + fecha(i.cuando) + '</p>' +
          '<table class="datos">' +
            fila('Pedido', resumen(e)) +
            fila('Ciudad', e.ciudad) +
            fila('Dirección', e.direccion) +
            fila('Teléfono', e.tel, wa) +
            fila('Correo', e.correo, e.correo ? 'mailto:' + e.correo : '') +
            fila('Redes', e.redes, /^https?:/i.test(e.redes || '') ? e.redes : '') +
            fila('Google', e.google, /^https?:/i.test(e.google || '') ? e.google : '') +
            fila('Pago', e.pago) +
            fila('Fianza', e.fianza ? e.fianza + ' €' : '') +
            fila('En qué punto', PASOS[i.paso] || '') +
          '</table>' +
          (e.notas ? '<p class="notas">' + esc(e.notas) + '</p>' : '') +
          (b.porque || colores
            ? '<div class="porque">' + (b.porque ? esc(b.porque) : 'Colores propuestos') +
              (colores ? '<div class="colores">' + colores + '</div>' : '') + '</div>'
            : '') +
          '<div class="acciones">' +
            (i.enlace ? '<a class="btn btn-oro chico" href="' + esc(i.enlace) + '" target="_blank" rel="noopener">Abrir el diseño</a>' : '') +
            (wa ? '<a class="btn chico" href="' + esc(wa) + '" target="_blank" rel="noopener">WhatsApp</a>' : '') +
            (estado !== 'hecho' ? '<button class="chico" data-e="hecho">Marcar hecho</button>' : '') +
            (estado !== 'nuevo' ? '<button class="chico" data-e="nuevo">Volver a nuevo</button>' : '') +
            (estado !== 'descartado' ? '<button class="chico" data-e="descartado">Descartar</button>' : '') +
          '</div>' +
        '</article>';
    }).join('');
  }

  /* un solo oyente para todos los botones de la lista: las fichas se
     repintan enteras y así no hay que volver a engancharlos */
  $('lista').addEventListener('click', function (ev) {
    var b = ev.target.closest('button[data-e]');
    if (!b) return;
    var art = b.closest('.ficha');
    var item = todo.filter(function (i) { return i.clave === art.dataset.c; })[0];
    if (item) marcar(item, b.dataset.e, b);
  });

  /* ---------- arranque ---------- */
  var g = guardada();
  if (g) { probar(g, true); }
})();
</script>
</body>
</html>
