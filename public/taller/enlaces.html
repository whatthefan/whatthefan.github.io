<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Enlaces · PLEA5E</title>
<!--
  El panel de las direcciones cortas. Aqui se decide a donde manda el QR
  de una placa que YA esta pegada en la mesa de un bar.

  Esta pagina NO es publica: pide contrasena, la misma que el panel de
  pedidos. La contrasena no se comprueba aqui —eso seria de mentira,
  cualquiera abre el codigo— sino en la funcion del servidor, que sin
  ella no devuelve ni una letra.
-->
<style>
  :root{
    --noche:#06080E; --panel:#0F1522; --panel-2:#141B2B;
    --borde:#1C2536; --borde-claro:#2A3448;
    --txt:#EAEDF4; --txt-2:#8B95AB; --txt-3:#5D6679;
    --oro:#E9BC46; --oro-cl:#F8E1A6;
    --verde:#3BB273; --rojo:#D9534F;
    --r:8px;
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--noche); color:var(--txt);
    font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-text-size-adjust:100%;
  }
  .caja{max-width:820px; margin:0 auto; padding:20px 16px 80px}

  header.top{
    display:flex; align-items:center; gap:12px; flex-wrap:wrap;
    padding:16px 0 20px; border-bottom:1px solid var(--borde); margin-bottom:20px;
  }
  header.top h1{margin:0; font-size:19px; letter-spacing:.14em; text-transform:uppercase}
  header.top h1 b{color:var(--oro); font-weight:800}
  .crece{flex:1 1 auto}

  button,.btn{
    font:inherit; font-weight:600; cursor:pointer; border-radius:999px;
    border:1px solid var(--borde-claro); background:var(--panel-2); color:var(--txt);
    padding:9px 16px; text-decoration:none; display:inline-flex; align-items:center; gap:7px;
  }
  button:hover,.btn:hover{border-color:var(--txt-3)}
  button[disabled]{opacity:.5; cursor:default}
  .btn-oro{background:var(--oro); color:#100B00; border-color:var(--oro)}
  .btn-oro:hover{background:var(--oro-cl); border-color:var(--oro-cl)}
  .chico{padding:6px 12px; font-size:14px}
  .peligro{color:#F0A9A7; border-color:rgba(217,83,79,.4)}
  .peligro:hover{border-color:var(--rojo)}

  input{
    font:inherit; width:100%; padding:12px 14px; border-radius:var(--r);
    border:1px solid var(--borde-claro); background:var(--panel); color:var(--txt);
  }
  input:focus{outline:2px solid var(--oro); outline-offset:1px}
  label.campo{display:block; font-size:13px; color:var(--txt-2); margin-bottom:5px}

  /* ---- la puerta ---- */
  .puerta{max-width:380px; margin:14vh auto 0; text-align:center}
  .puerta h2{font-size:20px; margin:0 0 6px}
  .puerta p{color:var(--txt-2); font-size:14px; margin:0 0 20px}
  .puerta .fila{display:flex; gap:8px; margin-bottom:12px}
  .puerta .fila input{flex:1 1 auto}
  .recuerda{font-size:13px; color:var(--txt-3); display:flex; gap:7px; align-items:flex-start; text-align:left}
  .recuerda input{width:auto; flex:0 0 auto; margin-top:3px}

  /* ---- el formulario de arriba ---- */
  .nuevo{
    background:var(--panel); border:1px solid var(--borde); border-radius:12px;
    padding:16px; margin-bottom:22px;
  }
  .nuevo h2{margin:0 0 4px; font-size:16px}
  .nuevo .pista{margin:0 0 14px; font-size:13.5px; color:var(--txt-2)}
  .rejilla{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:12px}
  .rejilla > div:last-child{grid-column:1/-1}
  @media (max-width:560px){ .rejilla{grid-template-columns:1fr} }
  .prefijo{display:flex; align-items:center; gap:0}
  .prefijo span{
    font-size:14px; color:var(--txt-3); background:var(--panel-2); white-space:nowrap;
    border:1px solid var(--borde-claro); border-right:0; padding:12px 4px 12px 12px;
    border-radius:var(--r) 0 0 var(--r);
  }
  .prefijo input{border-radius:0 var(--r) var(--r) 0}

  /* ---- una ficha ---- */
  .ficha{
    background:var(--panel); border:1px solid var(--borde); border-radius:12px;
    padding:16px; margin-bottom:14px;
  }
  .ficha .cab{display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; margin-bottom:8px}
  .ficha h3{margin:0; font-size:17px; line-height:1.25}
  .corta{
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:13.5px;
    color:var(--oro-cl); word-break:break-all;
  }
  .toques{font-size:13px; color:var(--txt-3); margin-left:auto; white-space:nowrap}
  .toques b{color:var(--txt-2)}
  .destino{
    background:var(--panel-2); border-left:3px solid var(--borde-claro);
    padding:9px 12px; border-radius:0 var(--r) var(--r) 0; margin:0 0 10px;
    font-size:13px; word-break:break-all; color:var(--txt-2);
  }
  .cuando{font-size:13px; color:var(--txt-3); margin:0 0 12px}
  .acciones{display:flex; gap:8px; flex-wrap:wrap}
  .editar{margin-top:12px; padding-top:12px; border-top:1px solid var(--borde)}
  .editar .fila{display:flex; gap:8px; flex-wrap:wrap}
  .editar .fila input{flex:1 1 220px}

  .aviso{
    background:rgba(217,83,79,.12); border:1px solid rgba(217,83,79,.45);
    color:#F6C9C7; padding:12px 14px; border-radius:var(--r); font-size:14px; margin-bottom:16px;
  }
  .bien{
    background:rgba(59,178,115,.12); border:1px solid rgba(59,178,115,.45);
    color:#B7E5CD; padding:12px 14px; border-radius:var(--r); font-size:14px; margin-bottom:16px;
  }
  .vacio{text-align:center; color:var(--txt-2); padding:50px 20px; font-size:15px}
  .oculto{display:none !important}
</style>
</head>
<body>

<div class="caja">

  <!-- ═══ la puerta ═══ -->
  <section id="puerta" class="puerta">
    <h2>Enlaces <span style="color:var(--oro)">PLEA5E</span></h2>
    <p>Esta parte no es pública. Escribe la contraseña.</p>
    <form id="fClave">
      <div class="fila">
        <input id="clave" type="password" placeholder="Contraseña" autocomplete="current-password" autofocus>
        <button class="btn-oro" type="submit">Entrar</button>
      </div>
      <label class="recuerda">
        <input type="checkbox" id="recuerda" checked>
        <span>Recordarla en este aparato. No la marques en un ordenador que no sea tuyo.</span>
      </label>
    </form>
    <div id="errClave" class="aviso oculto" style="margin-top:16px"></div>
  </section>

  <!-- ═══ el panel ═══ -->
  <div id="panel" class="oculto">
    <header class="top">
      <h1><b>PLEA5E</b> · Enlaces</h1>
      <span class="crece"></span>
      <a class="btn chico" href="pedidos.html">Pedidos</a>
      <button class="chico" id="refrescar">Actualizar</button>
      <button class="chico" id="salir">Salir</button>
    </header>

    <div id="errPanel" class="aviso oculto"></div>
    <div id="okPanel" class="bien oculto"></div>

    <section class="nuevo">
      <h2>Dirección nueva</h2>
      <p class="pista">
        Esto es lo que va grabado en el QR de la placa. La placa no cambia nunca:
        lo que cambias aquí es a dónde salta.
      </p>
      <form id="fNuevo">
        <div class="rejilla">
          <div>
            <label class="campo" for="nNombre">Dirección corta</label>
            <div class="prefijo">
              <span>plea5e.es/r/</span>
              <input id="nNombre" type="text" placeholder="bar-manolo" autocomplete="off"
                     inputmode="url" spellcheck="false">
            </div>
          </div>
          <div>
            <label class="campo" for="nNegocio">Negocio (para acordarte tú)</label>
            <input id="nNegocio" type="text" placeholder="Bar Manolo, Córdoba" autocomplete="off">
          </div>
          <div>
            <label class="campo" for="nDestino">A dónde va</label>
            <input id="nDestino" type="text" autocomplete="off" spellcheck="false"
                   placeholder="El enlace de Google, o el código del sitio">
          </div>
        </div>
        <button class="btn-oro" type="submit">Guardar</button>
      </form>
    </section>

    <div id="lista"></div>
  </div>

</div>

<script>
(function () {
  'use strict';

  var API   = '/api/enlaces';
  var GUARD = 'plea5e_panel_clave';   /* la misma que el panel de pedidos */
  var clave = '';
  var todo  = [];

  var $ = function (id) { return document.getElementById(id); };
  function ver(el, si) { el.classList.toggle('oculto', !si); }
  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  /* ---------- entrar ---------- */

  function guardada() {
    try { return localStorage.getItem(GUARD) || ''; } catch (e) { return ''; }
  }

  $('fClave').addEventListener('submit', function (e) {
    e.preventDefault();
    var v = $('clave').value.trim();
    if (!v) return;
    probar(v, $('recuerda').checked);
  });

  function probar(v, recordar) {
    ver($('errClave'), false);
    pedir(v).then(function (d) {
      clave = v;
      if (recordar) { try { localStorage.setItem(GUARD, v); } catch (e) {} }
      ver($('puerta'), false);
      ver($('panel'), true);
      pinta(d.lista || []);
    }).catch(function (err) {
      $('errClave').textContent = err.message;
      ver($('errClave'), true);
      $('clave').value = '';
      $('clave').focus();
    });
  }

  $('salir').addEventListener('click', function () {
    try { localStorage.removeItem(GUARD); } catch (e) {}
    location.reload();
  });

  /* ---------- hablar con el servidor ---------- */

  /* La contrasena va en una cabecera, nunca en la direccion: lo que va en
     la direccion se queda en el historial del navegador y en los
     registros de medio mundo. */
  function pedir(v) {
    return fetch(API, { headers: { 'x-panel-clave': v }, cache: 'no-store' })
      .then(function (r) {
        if (r.status === 401) throw new Error('Esa contraseña no es.');
        return r.json().catch(function () { return {}; }).then(function (d) {
          if (!r.ok) {
            if (/PANEL_CLAVE/.test(d.error || '')) {
              throw new Error('Falta poner PANEL_CLAVE en las variables del Worker.');
            }
            throw new Error(d.error || 'No he podido leer los enlaces (' + r.status + ').');
          }
          return d;
        });
      })
      .catch(function (err) {
        if (err instanceof TypeError) {
          throw new Error('No hay respuesta del servidor. ¿Estás en plea5e.es y no en un archivo suelto?');
        }
        throw err;
      });
  }

  function manda(cuerpo) {
    return fetch(API, {
      method: 'POST',
      headers: { 'x-panel-clave': clave, 'Content-Type': 'application/json' },
      body: JSON.stringify(cuerpo)
    }).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (d) {
        if (!r.ok) throw new Error(d.error || 'No se ha podido guardar.');
        return d;
      });
    });
  }

  function recarga() {
    return pedir(clave).then(function (d) { pinta(d.lista || []); });
  }

  function falla(err) {
    $('errPanel').textContent = err.message;
    ver($('errPanel'), true);
    ver($('okPanel'), false);
  }
  function acierta(txt) {
    $('okPanel').textContent = txt;
    ver($('okPanel'), true);
    ver($('errPanel'), false);
  }

  /* ---------- crear ---------- */

  $('fNuevo').addEventListener('submit', function (e) {
    e.preventDefault();
    var b = this.querySelector('button');
    b.disabled = true;
    manda({
      accion:  'guardar',
      nombre:  $('nNombre').value,
      negocio: $('nNegocio').value,
      destino: $('nDestino').value
    }).then(function (d) {
      $('nNombre').value = $('nNegocio').value = $('nDestino').value = '';
      acierta('Guardado. El QR tiene que llevar: plea5e.es/r/' + d.nombre);
      return recarga();
    }).catch(falla).then(function () { b.disabled = false; });
  });

  $('refrescar').addEventListener('click', function () {
    var b = this;
    b.disabled = true;
    ver($('errPanel'), false);
    recarga().catch(falla).then(function () { b.disabled = false; });
  });

  /* ---------- pintar ---------- */

  function fecha(iso) {
    var d = new Date(iso || 0);
    if (isNaN(d.getTime()) || !iso) return '';
    var dos = function (n) { return (n < 10 ? '0' : '') + n; };
    return dos(d.getDate()) + '/' + dos(d.getMonth() + 1) + '/' + d.getFullYear();
  }

  function pinta(lista) {
    todo = lista;
    var caja = $('lista');
    if (!lista.length) {
      caja.innerHTML = '<p class="vacio">Todavía no hay ninguna. Crea la primera ahí arriba, ' +
                       'y esa es la que va grabada en el QR de la placa.</p>';
      return;
    }
    caja.innerHTML = lista.map(function (e) {
      var corta = 'plea5e.es/r/' + esc(e.nombre);
      return '' +
        '<article class="ficha" data-n="' + esc(e.nombre) + '">' +
          '<div class="cab">' +
            '<h3>' + (esc(e.negocio) || esc(e.nombre)) + '</h3>' +
            '<span class="toques"><b>' + e.total + '</b> toques · hoy <b>' + e.hoy + '</b></span>' +
          '</div>' +
          '<p class="corta">' + corta + '</p>' +
          '<p class="destino">→ ' + esc(e.destino) + '</p>' +
          '<p class="cuando">Creada el ' + fecha(e.creado) +
            (e.cambiado && e.cambiado !== e.creado ? ' · cambiada el ' + fecha(e.cambiado) : '') +
          '</p>' +
          '<div class="acciones">' +
            '<a class="btn chico" href="https://' + corta + '" target="_blank" rel="noopener">Probarla</a>' +
            '<button class="chico" data-hace="editar">Cambiar el destino</button>' +
            '<button class="chico peligro" data-hace="borrar">Borrar</button>' +
          '</div>' +
          '<div class="editar oculto">' +
            '<label class="campo">El destino nuevo. La placa del bar no se toca.</label>' +
            '<div class="fila">' +
              '<input type="text" value="' + esc(e.destino) + '" spellcheck="false">' +
              '<button class="btn-oro chico" data-hace="guardar">Guardar</button>' +
            '</div>' +
          '</div>' +
        '</article>';
    }).join('');
  }

  /* Un solo oyente para toda la lista: asi los botones siguen funcionando
     cada vez que se vuelve a pintar, sin volver a engancharlos uno a uno. */
  $('lista').addEventListener('click', function (ev) {
    var b = ev.target.closest('button[data-hace]');
    if (!b) return;
    var ficha  = b.closest('.ficha');
    var nombre = ficha.dataset.n;
    var hace   = b.dataset.hace;

    if (hace === 'editar') {
      var caja = ficha.querySelector('.editar');
      var abre = caja.classList.contains('oculto');
      ver(caja, abre);
      if (abre) caja.querySelector('input').focus();
      return;
    }

    if (hace === 'guardar') {
      b.disabled = true;
      manda({ accion: 'guardar', nombre: nombre,
              negocio: (todo.filter(function (x) { return x.nombre === nombre; })[0] || {}).negocio,
              destino: ficha.querySelector('.editar input').value })
        .then(function () {
          acierta('Cambiado. Las placas de ' + nombre + ' ya saltan al destino nuevo.');
          return recarga();
        }).catch(function (err) { falla(err); b.disabled = false; });
      return;
    }

    if (hace === 'borrar') {
      /* Borrar deja muertas las placas que ya estan pegadas en una mesa,
         asi que se pregunta y se dice exactamente que se rompe. */
      if (!confirm('¿Seguro? Las placas de "' + nombre + '" que ya estén puestas ' +
                   'dejarán de llevar a ningún sitio al escanear el QR.')) return;
      b.disabled = true;
      manda({ accion: 'borrar', nombre: nombre })
        .then(function () { acierta('Borrada.'); return recarga(); })
        .catch(function (err) { falla(err); b.disabled = false; });
    }
  });

  /* ---------- arranque ---------- */

  var ya = guardada();
  if (ya) probar(ya, true);
})();
</script>
</body>
</html>
