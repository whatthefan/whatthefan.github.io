<svg xmlns="http://www.w3.org/2000/svg" viewBox="-190 -40 1404 1260" width="1404" height="1260">
<title>Estrellita PLEA5E</title>

<!-- ESTRELLITA — la mascota de PLEA5E.

     No es un dibujo inventado: es TU sello. La estrella es la misma, el
     5 es el mismo trazado. Lo unico que se le anade son extremidades.

     Y encaja solo, porque una estrella de cinco puntas ya viene con las
     piernas puestas: las dos puntas de abajo. Solo habia que calzarlas.

     Estilo "rubber hose", el de los dibujos de los anos 30 (Betty Boop,
     Mickey antiguo, Cuphead): brazos de manguera sin codos, guantes
     blancos, zapatones y ojos enormes. Contorno negro grueso en todo,
     que es lo que lo hace de epoca y lo que hace que se lea pequeno en
     un movil.                                                          -->

<defs>
  <style>
    .tinta  { fill:none; stroke:#0A0E16; stroke-linecap:round; stroke-linejoin:round }
    .brazo  { stroke-width:40 }
    .pierna { stroke-width:52 }
    .borde  { stroke:#0A0E16; stroke-width:26; stroke-linejoin:round }
  </style>

  <!-- El guante, dibujado una vez y colocado dos. Circulo con pulgar y
       tres pliegues: el guante de cuatro dedos de toda la vida. -->
  <g id="guante">
    <circle class="borde" cx="0" cy="0" r="82" fill="#F7F4EC"/>
    <path class="borde" fill="#F7F4EC"
          d="M-58 -34 C -92 -66, -126 -62, -138 -34 C -150 -6, -128 22, -92 24"/>
    <g class="tinta" stroke-width="14">
      <path d="M22 54 C 34 40, 40 24, 40 8"/>
      <path d="M54 34 C 62 22, 66 10, 66 -2"/>
      <path d="M20 -50 C 34 -40, 42 -26, 44 -12"/>
    </g>
  </g>

  <!-- El zapato, igual: uno dibujado, dos colocados. -->
  <g id="zapato">
    <path class="borde" fill="#0A0E16"
          d="M0 0 C -86 0, -146 34, -146 84 C -146 120, -92 134, -18 134
             L 52 134 C 80 134, 92 116, 92 90 L 92 22 C 92 6, 76 0, 52 0 Z"/>
    <path fill="#F2EFE6"
          d="M-140 98 C -120 128, -66 134, -18 134 L 52 134 C 76 134, 89 123, 91 100 Z"/>
  </g>
</defs>

<!-- ── BRAZOS Y PIERNAS: van detras del cuerpo ── -->
<path class="tinta brazo"  d="M262 476 C 120 462, 44 524, 6 612"/>
<path class="tinta brazo"  d="M762 476 C 900 458, 990 388, 1016 266"/>
<path class="tinta pierna" d="M302 838 C 294 906, 290 952, 288 1000"/>
<path class="tinta pierna" d="M722 838 C 730 906, 734 952, 736 1000"/>

<use href="#zapato" x="288" y="1000"/>
<use href="#zapato" x="736" y="1000" transform="translate(1472 0) scale(-1 1)"/>

<!-- ── EL CUERPO: tu estrella ── -->
<path class="borde" fill="#E9BC46"
      d="M512 41L633.8 323.8L962.6 352.3L709.1 555.6L776.8 856L512 698.8L247.2 856L314.9 555.6L61.4 352.3L390.2 323.8Z"/>

<!-- ── EL 5: tu mismo trazado. Se encoge y baja un poco para dejarle
        sitio a la cara, pero es letra por letra el de tu sello. ── -->
<path fill="#0A0E16" transform="translate(407.3 696.2) scale(0.42)"
      d="M247.1 12.2Q147.9 12.2 85.2-36.9Q22.5-85.9 22.5-187.5L22.5-315.4L201.2-315.4L201.2-241.7Q201.2-218.7 203.9-197.3Q206.5-175.8 216.3-162.1Q226.1-148.4 247.1-148.4Q274.9-148.4 283.7-167.2Q292.5-186 292.5-215.3L292.5-384.3Q292.5-405.3 289.8-425.8Q287.1-446.3 277.8-460Q268.6-473.6 248-473.6Q199.2-473.6 199.2-402.8L41.5-402.8L41.5-859.9L451.2-859.9L451.2-698.7L204.6-698.7L204.6-577.6Q217.3-593.3 239-605.2Q260.7-617.2 290-617.2Q348.6-617.2 385.5-594.7Q422.4-572.3 442.1-532.2Q461.9-492.2 469.5-439.5Q477.1-386.7 477.1-326.2Q477.1-248.5 469-186.3Q460.9-124 437.3-79.6Q413.6-35.2 367.9-11.5Q322.3 12.2 247.1 12.2"/>

<!-- ── LOS OJOS: en la punta de arriba, desbordandola un poco. Eso de
        que los ojos se salgan de la cabeza es marca de la casa en los
        dibujos de esa epoca, y es lo que convierte un logo en alguien. -->
<g class="borde">
      <ellipse cx="438" cy="238" rx="80" ry="94" fill="#F7F4EC"/>
      <ellipse cx="588" cy="230" rx="80" ry="94" fill="#F7F4EC"/>
    </g>
    <ellipse cx="476" cy="260" rx="31" ry="39" fill="#0A0E16"/>
    <circle cx="487" cy="246" r="11" fill="#F7F4EC"/>
    <ellipse cx="626" cy="252" rx="31" ry="39" fill="#0A0E16"/>
    <circle cx="637" cy="238" r="11" fill="#F7F4EC"/>

<!-- ── LOS GUANTES: el de la derecha saluda ── -->
<use href="#guante" transform="translate(6 612) rotate(14)"/>
<use href="#guante" transform="translate(1016 266) rotate(-34) scale(-1 1)"/>
</svg>
