<g transform="translate(1024 0) scale(-1 1)"><path fill="#0A0E16" transform="translate(407.3 696.2) scale(0.42)" d="M247.1 12.2Q147.9 12.2 85.2-36.9Q22.5-85.9 22.5-187.5L22.5-315.4L201.2-315.4L201.2-241.7Q201.2-218.7 203.9-197.3Q206.5-175.8 216.3-162.1Q226.1-148.4 247.1-148.4Q274.9-148.4 283.7-167.2Q292.5-186 292.5-215.3L292.5-384.3Q292.5-405.3 289.8-425.8Q287.1-446.3 277.8-460Q268.6-473.6 248-473.6Q199.2-473.6 199.2-402.8L41.5-402.8L41.5-859.9L451.2-859.9L451.2-698.7L204.6-698.7L204.6-577.6Q217.3-593.3 239-605.2Q260.7-617.2 290-617.2Q348.6-617.2 385.5-594.7Q422.4-572.3 442.1-532.2Q461.9-492.2 469.5-439.5Q477.1-386.7 477.1-326.2Q477.1-248.5 469-186.3Q460.9-124 437.3-79.6Q413.6-35.2 367.9-11.5Q322.3 12.2 247.1 12.2"/></g>
  <g class="borde">
  <ellipse cx="438" cy="238" rx="80" ry="94" fill="#F7F4EC"/>
